[General]
network = src.FiveGNetwork
sim-time-limit = 120s
#scheduler-class = "omnetpp::cRealTimeScheduler"

# --- Chemins (Identiques) ---
ned-path = ../src:../../Simu5G/src:../../inet4.5/src

# --- Config Réseau ---
*.configurator.typename = "Ipv4NetworkConfigurator"
*.configurator.addDefaultRoutes = true

# ---------------------------------------------------------------------------
# BLINDAGE TOTAL ANTI-DIALOGUE ET ANTI-PORT
# ---------------------------------------------------------------------------
**.masterId = 1
**.macCellId = 1
**.nrMasterId = 1
**.nrMacCellId = 1

# Délais de transmission
**.server.ppp[*].**.delay = 50ms
**.gnb[0].ppp[*].**.delay = 50ms

# Paramètres de Mobilité Globaux
**.initialZ = 0m
**.mobility.initFromDisplayString = false
**.mobility.updateInterval = 0.01s
**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 100m
**.speedStdDev = 0mps
**.angleStdDev = 0deg
**.alpha = 0.5
**.margin = 10m

# --- CORRECTION DES PORTS ---
# Au lieu d'un port fixe 1000, on utilise le port (1000 + index de l'app)
# pour éviter les collisions sur le serveur qui a 15 apps.
*.server.app[*].localPort = 1000 + ancestorIndex(0)
*.ue[*].app[0].localPort = 1000
**.startTime = 0.1s
**.stopTime = -1s

[Config Statistics]
**.channelModel = "UMA"
**.pathlossModel = "P3GPP38901"
**.transmitter.power = 0.01W
**.cellularNic.phy.receiver.noiseFigure = 5dB

# ---------------------------------------------------------------------------
# VARIATIONS POUR L'APPRENTISSAGE DU GNN (Généralisation)
# ---------------------------------------------------------------------------
**.gnb[*].nic.phy.transmitter.power = ${power=0.01W, 0.1W, 0.5W, 2W}
**.gnb[*].cellularNic.mac.schedulingDisciplineDl = ${sched="PF","MAXCI","DRR", "QOS_PF", "MAXCI_MB", "ALLOCATOR_BESTFIT"}
**.gnb[*].cellularNic.mac.schedulingDisciplineUl = ${sched}
**.gnb[*].cellularNic.numBands = 50

**.rlc.um.queueSize = ${qSize= 50KiB, 100KiB, 2MiB, 10MiB}
**.mac.queueSize = ${qSize}

# ---------------------------------------------------------------------------
# CONFIGURATION DU SCÉNARIO 15 UEs (DT-Scenario)
# ---------------------------------------------------------------------------
[Config DT-Scenario]
extends = Statistics

*.numUe = 15
*.numGnb = 1
*.server.numApps = 15
*.ue[*].numApps = 1

*.dtConnector.numMobilityModules = 16
*.dtConnector.samplingInterval = 0.1s
*.dtConnector.mobilityModulePaths = "ue[0].mobility,ue[1].mobility,ue[2].mobility,ue[3].mobility,ue[4].mobility,ue[5].mobility,ue[6].mobility,ue[7].mobility,ue[8].mobility,ue[9].mobility,ue[10].mobility,ue[11].mobility,ue[12].mobility,ue[13].mobility,ue[14].mobility,gnb[0].mobility"

# Position du gNB fixe
*.gnb[0].mobility.typename = "StationaryMobility"
*.gnb[0].mobility.initialX = 500m
*.gnb[0].mobility.initialY = 500m
*.gnb[0].mobility.initialZ = 30m

# ===========================================================================
# DÉFINITION DES TRAFICS ET MOBILITÉS (Correction des Ports incluse)
# ===========================================================================

# --- [EXPONENTIAL] : UEs 0, 1, 2 (Downlink) ---
*.server.app[0..2].typename = "UdpBasicApp"
*.server.app[0..2].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[0..2].destPort = 1000 
*.server.app[0..2].messageLength = 1450B
*.server.app[0..2].sendInterval = exponential(0.002s)
*.ue[0..2].app[0].typename = "UdpSink"
*.ue[0..2].mobility.typename = "GaussMarkovMobility"
*.ue[0..2].mobility.speed = uniform(10mps, 20mps)

# --- [CBR / DETERMINISTIC] : UEs 3, 4 (Uplink) ---
*.ue[3..4].app[0].typename = "UdpBasicApp"
*.ue[3..4].app[0].destAddresses = "server"
*.ue[3..4].app[0].destPort = 1000 + ancestorIndex(1) # Cible le port spécifique du serveur
*.ue[3..4].app[0].messageLength = 1000B
*.ue[3..4].app[0].sendInterval = 0.001s
*.server.app[3..4].typename = "UdpSink"
*.ue[3..4].mobility.typename = "LinearMobility"
*.ue[3..4].mobility.speed = 15mps
*.ue[3..4].mobility.angle = 45deg

# --- [UNIFORM / JITTERY] : UEs 5, 6 (Downlink) ---
*.server.app[5..6].typename = "UdpBasicApp"
*.server.app[5..6].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[5..6].destPort = 1000
*.server.app[5..6].messageLength = 800B
*.server.app[5..6].sendInterval = uniform(0.005s, 0.015s)
*.ue[5..6].app[0].typename = "UdpSink"
*.ue[5..6].mobility.typename = "CircleMobility"
*.ue[5..6].mobility.cx = 500m
*.ue[5..6].mobility.cy = 500m
*.ue[5..6].mobility.r = 100m
*.ue[5..6].mobility.speed = 5mps

# --- [NORMAL / VBR VIDEO] : UEs 7, 8 (Uplink) ---
*.ue[7..8].app[0].typename = "UdpBasicApp"
*.ue[7..8].app[0].destAddresses = "server"
*.ue[7..8].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[7..8].app[0].messageLength = int(normal(3000, 500)) * 1B
*.ue[7..8].app[0].sendInterval = 0.033s
*.server.app[7..8].typename = "UdpSink"
*.ue[7..8].mobility.typename = "StationaryMobility"
*.ue[7..8].mobility.initialX = uniform(400m, 600m)
*.ue[7..8].mobility.initialY = uniform(400m, 600m)

# --- [ONOFF / BURST] : UE 9 (Downlink) ---
*.server.app[9].typename = "UdpBasicApp"
*.server.app[9].destAddresses = "ue[9]"
*.server.app[9].destPort = 1000
*.server.app[9].messageLength = 1450B
*.server.app[9].sendInterval = uniform(0,1) < 0.8 ? 0.0002s : 0.4s
*.ue[9].app[0].typename = "UdpSink"
*.ue[9].mobility.typename = "GaussMarkovMobility"
*.ue[9].mobility.speed = 1.5mps

# --- [PARETO / INTERNET] : UEs 10, 11 (Downlink) ---
*.server.app[10..11].typename = "UdpBasicApp"
*.server.app[10..11].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[10..11].destPort = 1000
*.server.app[10..11].messageLength = 1450B
*.server.app[10..11].sendInterval = pareto(0.001s, 1.3)
*.ue[10..11].app[0].typename = "UdpSink"
*.ue[10..11].mobility.typename = "LinearMobility"
*.ue[10..11].mobility.speed = 30mps

# --- [URLLC] : UE 12 (Downlink) ---
*.server.app[12].typename = "UdpBasicApp"
*.server.app[12].destAddresses = "ue[12]"
*.server.app[12].destPort = 1000
*.server.app[12].messageLength = 200B
*.server.app[12].sendInterval = 0.01s
*.ue[12].app[0].typename = "UdpSink"
*.ue[12].mobility.typename = "CircleMobility"
*.ue[12].mobility.r = 300m
*.ue[12].mobility.cx = 500m
*.ue[12].mobility.cy = 400m
*.ue[12].mobility.speed = 20mps

# --- [mMTC IoT] : UE 13 (Uplink) ---
*.ue[13].app[0].typename = "UdpBasicApp"
*.ue[13].app[0].destAddresses = "server"
*.ue[13].app[0].destPort = 1013 # Port spécifique (1000 + 13)
*.ue[13].app[0].messageLength = 50B
*.ue[13].app[0].sendInterval = 1s
*.server.app[13].typename = "UdpSink"
*.ue[13].mobility.typename = "StationaryMobility"
*.ue[13].mobility.initialX = 900m
*.ue[13].mobility.initialY = 900m

# --- [SUPER-FAST] : UE 14 (Downlink) ---
*.server.app[14].typename = "UdpBasicApp"
*.server.app[14].destAddresses = "ue[14]"
*.server.app[14].destPort = 1000
*.server.app[14].messageLength = 1450B
*.server.app[14].sendInterval = 0.0005s
*.ue[14].app[0].typename = "UdpSink"
*.ue[14].mobility.typename = "GaussMarkovMobility"
*.ue[14].mobility.speed = 60mps