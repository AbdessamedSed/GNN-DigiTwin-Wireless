[General]
network = src.FiveGNetwork
sim-time-limit = 120s
#scheduler-class = "omnetpp::cRealTimeScheduler"

# --- Chemins ---
ned-path = ../src:../../Simu5G/src:../../inet4.5/src

# --- Config Réseau ---
*.configurator.typename = "Ipv4NetworkConfigurator"
*.configurator.addDefaultRoutes = true

# Désactiver les gros fichiers .vec/.sca OMNeT++
**.vector-recording = false
**.scalar-recording = false

# ---------------------------------------------------------------------------
# BLINDAGE TOTAL ANTI-DIALOGUE ET ANTI-PORT
# ---------------------------------------------------------------------------
**.masterId = 1
**.macCellId = 1
**.nrMasterId = 1
**.nrMacCellId = 1

# Délais de transmission
**.server.ppp[*].**.delay = 50ms
**.gnb[*].ppp[*].**.delay = 50ms

# Paramètres de Mobilité Globaux
**.initialZ = 0m
**.mobility.initFromDisplayString = false
**.mobility.updateInterval = 0.01s
**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 100m
**.speedStdDev = 0mps
**.angleStdDev = 0deg
**.alpha = 0.5
**.margin = 10m

# --- CORRECTION DES PORTS ---
*.server.app[*].localPort = 1000 + ancestorIndex(0)
*.ue[*].app[0].localPort = 1000
**.startTime = 0.1s
**.stopTime = -1s

[Config Statistics]
**.channelModel = "UMA"
**.pathlossModel = "P3GPP38901"
**.transmitter.power = 0.01W
**.cellularNic.phy.receiver.noiseFigure = 5dB

# ---------------------------------------------------------------------------
# VARIATIONS POUR L'APPRENTISSAGE DU GNN
# ---------------------------------------------------------------------------
**.gnb[*].nic.phy.transmitter.power = ${power=0.01W, 0.1W, 0.5W, 2W}
**.gnb[*].cellularNic.mac.schedulingDisciplineDl = ${sched="PF","MAXCI","DRR","QOS_PF","MAXCI_MB","ALLOCATOR_BESTFIT"}
**.gnb[*].cellularNic.mac.schedulingDisciplineUl = ${sched}
**.gnb[*].cellularNic.numBands = 50

**.rlc.um.queueSize = ${qSize=50KiB, 100KiB, 2MiB, 10MiB}
**.mac.queueSize = ${qSize}

# ---------------------------------------------------------------------------
# SC07 : 60 UEs, 4 gNBs, CELL-EDGE INTERFERENCE AND BUFFER PRESSURE
# ---------------------------------------------------------------------------
[Config DT-Scenario]
extends = Statistics

*.numUe = 60
*.numGnb = 4
*.server.numApps = 60
*.ue[*].numApps = 1

*.dtConnector.numMobilityModules = 64
*.dtConnector.samplingInterval = 0.1s
*.dtConnector.mobilityModulePaths = "ue[0].mobility,ue[1].mobility,ue[2].mobility,ue[3].mobility,ue[4].mobility,ue[5].mobility,ue[6].mobility,ue[7].mobility,ue[8].mobility,ue[9].mobility,ue[10].mobility,ue[11].mobility,ue[12].mobility,ue[13].mobility,ue[14].mobility,ue[15].mobility,ue[16].mobility,ue[17].mobility,ue[18].mobility,ue[19].mobility,ue[20].mobility,ue[21].mobility,ue[22].mobility,ue[23].mobility,ue[24].mobility,ue[25].mobility,ue[26].mobility,ue[27].mobility,ue[28].mobility,ue[29].mobility,ue[30].mobility,ue[31].mobility,ue[32].mobility,ue[33].mobility,ue[34].mobility,ue[35].mobility,ue[36].mobility,ue[37].mobility,ue[38].mobility,ue[39].mobility,ue[40].mobility,ue[41].mobility,ue[42].mobility,ue[43].mobility,ue[44].mobility,ue[45].mobility,ue[46].mobility,ue[47].mobility,ue[48].mobility,ue[49].mobility,ue[50].mobility,ue[51].mobility,ue[52].mobility,ue[53].mobility,ue[54].mobility,ue[55].mobility,ue[56].mobility,ue[57].mobility,ue[58].mobility,ue[59].mobility,gnb[0].mobility,gnb[1].mobility,gnb[2].mobility,gnb[3].mobility"

# ===========================================================================
# POSITION DES 4 gNBs
# Les gNBs sont placés en grille; les UEs sont volontairement proches des zones
# frontières pour créer cell-edge interference.
# ===========================================================================
*.gnb[0].mobility.typename = "StationaryMobility"
*.gnb[0].mobility.initialX = 250m
*.gnb[0].mobility.initialY = 250m
*.gnb[0].mobility.initialZ = 30m

*.gnb[1].mobility.typename = "StationaryMobility"
*.gnb[1].mobility.initialX = 750m
*.gnb[1].mobility.initialY = 250m
*.gnb[1].mobility.initialZ = 30m

*.gnb[2].mobility.typename = "StationaryMobility"
*.gnb[2].mobility.initialX = 250m
*.gnb[2].mobility.initialY = 750m
*.gnb[2].mobility.initialZ = 30m

*.gnb[3].mobility.typename = "StationaryMobility"
*.gnb[3].mobility.initialX = 750m
*.gnb[3].mobility.initialY = 750m
*.gnb[3].mobility.initialZ = 30m

# ===========================================================================
# ASSOCIATION DES UEs AUX 4 gNBs
# 15 UEs par gNB
# ===========================================================================
*.gnb[0].masterId = 1
*.gnb[0].macCellId = 1
*.gnb[0].nrMasterId = 1
*.gnb[0].nrMacCellId = 1

*.gnb[1].masterId = 2
*.gnb[1].macCellId = 2
*.gnb[1].nrMasterId = 2
*.gnb[1].nrMacCellId = 2

*.gnb[2].masterId = 3
*.gnb[2].macCellId = 3
*.gnb[2].nrMasterId = 3
*.gnb[2].nrMacCellId = 3

*.gnb[3].masterId = 4
*.gnb[3].macCellId = 4
*.gnb[3].nrMasterId = 4
*.gnb[3].nrMacCellId = 4

*.ue[0..14].masterId = 1
*.ue[0..14].macCellId = 1
*.ue[0..14].nrMasterId = 1
*.ue[0..14].nrMacCellId = 1

*.ue[15..29].masterId = 2
*.ue[15..29].macCellId = 2
*.ue[15..29].nrMasterId = 2
*.ue[15..29].nrMacCellId = 2

*.ue[30..44].masterId = 3
*.ue[30..44].macCellId = 3
*.ue[30..44].nrMasterId = 3
*.ue[30..44].nrMacCellId = 3

*.ue[45..59].masterId = 4
*.ue[45..59].macCellId = 4
*.ue[45..59].nrMasterId = 4
*.ue[45..59].nrMacCellId = 4

# ===========================================================================
# SC07 TRAFFIC + CELL-EDGE INTERFERENCE + BUFFER PRESSURE
# Types conservés : EXPONENTIAL, DETERMINISTIC, UNIFORM, ONOFF, PPBP
# Mobilités conservées : GaussMarkov, Linear, Circle, Stationary
# ===========================================================================

# ---------------------------------------------------------------------------
# UEs 0..11 : EXPONENTIAL DL, proches des frontières entre cellules
# ---------------------------------------------------------------------------
*.server.app[0..11].typename = "UdpBasicApp"
*.server.app[0..11].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[0..11].destPort = 1000
*.server.app[0..11].messageLength = 1450B
*.server.app[0..11].sendInterval = exponential(0.0008s)
*.ue[0..11].app[0].typename = "UdpSink"

*.ue[0..11].mobility.typename = "GaussMarkovMobility"
*.ue[0..11].mobility.initialX = uniform(430m, 570m)
*.ue[0..11].mobility.initialY = uniform(300m, 500m)
*.ue[0..11].mobility.speed = uniform(5mps, 15mps)

# ---------------------------------------------------------------------------
# UEs 12..23 : DETERMINISTIC UL, pression forte sur les buffers
# ---------------------------------------------------------------------------
*.ue[12..23].app[0].typename = "UdpBasicApp"
*.ue[12..23].app[0].destAddresses = "server"
*.ue[12..23].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[12..23].app[0].messageLength = 1450B
*.ue[12..23].app[0].sendInterval = 0.0008s
*.server.app[12..23].typename = "UdpSink"

*.ue[12..23].mobility.typename = "LinearMobility"
*.ue[12..23].mobility.initialX = uniform(430m, 570m)
*.ue[12..23].mobility.initialY = uniform(200m, 500m)
*.ue[12..23].mobility.speed = uniform(8mps, 20mps)
*.ue[12..23].mobility.angle = uniform(0deg, 360deg)

# ---------------------------------------------------------------------------
# UEs 24..35 : UNIFORM DL, proche du centre inter-cellules
# ---------------------------------------------------------------------------
*.server.app[24..35].typename = "UdpBasicApp"
*.server.app[24..35].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[24..35].destPort = 1000
*.server.app[24..35].messageLength = 1450B
*.server.app[24..35].sendInterval = uniform(0.001s, 0.003s)
*.ue[24..35].app[0].typename = "UdpSink"

*.ue[24..35].mobility.typename = "CircleMobility"
*.ue[24..35].mobility.cx = 500m
*.ue[24..35].mobility.cy = 500m
*.ue[24..35].mobility.r = 220m
*.ue[24..35].mobility.speed = 12mps

# ---------------------------------------------------------------------------
# UEs 36..47 : ONOFF DL, bursts pour buffer pressure
# ---------------------------------------------------------------------------
*.server.app[36..47].typename = "UdpBasicApp"
*.server.app[36..47].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[36..47].destPort = 1000
*.server.app[36..47].messageLength = 1450B
*.server.app[36..47].sendInterval = uniform(0,1) < 0.85 ? 0.0002s : 0.2s
*.ue[36..47].app[0].typename = "UdpSink"

*.ue[36..47].mobility.typename = "GaussMarkovMobility"
*.ue[36..47].mobility.initialX = uniform(430m, 570m)
*.ue[36..47].mobility.initialY = uniform(430m, 570m)
*.ue[36..47].mobility.speed = uniform(3mps, 12mps)

# ---------------------------------------------------------------------------
# UEs 48..59 : PPBP DL, heavy-tailed traffic près des cell edges
# ---------------------------------------------------------------------------
*.server.app[48..59].typename = "UdpBasicApp"
*.server.app[48..59].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[48..59].destPort = 1000
*.server.app[48..59].messageLength = 1450B
*.server.app[48..59].sendInterval = pareto(0.0008s, 1.3)
*.ue[48..59].app[0].typename = "UdpSink"

*.ue[48..59].mobility.typename = "LinearMobility"
*.ue[48..59].mobility.initialX = uniform(430m, 570m)
*.ue[48..59].mobility.initialY = uniform(430m, 570m)
*.ue[48..59].mobility.speed = uniform(5mps, 18mps)
*.ue[48..59].mobility.angle = uniform(0deg, 360deg)