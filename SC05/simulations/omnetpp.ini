[General]
network = src.FiveGNetwork
sim-time-limit = 120s
#scheduler-class = "omnetpp::cRealTimeScheduler"

# --- Chemins ---
ned-path = ../src:../../Simu5G/src:../../inet4.5/src

# --- Config Réseau ---
*.configurator.typename = "Ipv4NetworkConfigurator"
*.configurator.addDefaultRoutes = true

# Désactiver les gros fichiers .vec/.sca OMNeT++
**.vector-recording = false
**.scalar-recording = false

# ---------------------------------------------------------------------------
# BLINDAGE TOTAL ANTI-DIALOGUE ET ANTI-PORT
# ---------------------------------------------------------------------------
**.masterId = 1
**.macCellId = 1
**.nrMasterId = 1
**.nrMacCellId = 1

# Délais de transmission
**.server.ppp[*].**.delay = 50ms
**.gnb[*].ppp[*].**.delay = 50ms

# Paramètres de Mobilité Globaux
**.initialZ = 0m
**.mobility.initFromDisplayString = false
**.mobility.updateInterval = 0.01s
**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 100m
**.speedStdDev = 0mps
**.angleStdDev = 0deg
**.alpha = 0.5
**.margin = 10m

# --- CORRECTION DES PORTS ---
*.server.app[*].localPort = 1000 + ancestorIndex(0)
*.ue[*].app[0].localPort = 1000
**.startTime = 0.1s
**.stopTime = -1s

[Config Statistics]
**.channelModel = "UMA"
**.pathlossModel = "P3GPP38901"
**.transmitter.power = 0.01W
**.cellularNic.phy.receiver.noiseFigure = 5dB

# ---------------------------------------------------------------------------
# VARIATIONS POUR L'APPRENTISSAGE DU GNN
# ---------------------------------------------------------------------------
**.gnb[*].nic.phy.transmitter.power = ${power=0.01W, 0.1W, 0.5W, 2W}
**.gnb[*].cellularNic.mac.schedulingDisciplineDl = ${sched="PF","MAXCI","DRR","QOS_PF","MAXCI_MB","ALLOCATOR_BESTFIT"}
**.gnb[*].cellularNic.mac.schedulingDisciplineUl = ${sched}
**.gnb[*].cellularNic.numBands = 50

**.rlc.um.queueSize = ${qSize=50KiB, 100KiB, 2MiB, 10MiB}
**.mac.queueSize = ${qSize}

# ---------------------------------------------------------------------------
# SC05 : 48 UEs, 4 gNBs, MOBILITY STRESS / FAST MOBILITY
# ---------------------------------------------------------------------------
[Config DT-Scenario]
extends = Statistics

*.numUe = 48
*.numGnb = 4
*.server.numApps = 48
*.ue[*].numApps = 1

*.dtConnector.numMobilityModules = 52
*.dtConnector.samplingInterval = 0.1s
*.dtConnector.mobilityModulePaths = "ue[0].mobility,ue[1].mobility,ue[2].mobility,ue[3].mobility,ue[4].mobility,ue[5].mobility,ue[6].mobility,ue[7].mobility,ue[8].mobility,ue[9].mobility,ue[10].mobility,ue[11].mobility,ue[12].mobility,ue[13].mobility,ue[14].mobility,ue[15].mobility,ue[16].mobility,ue[17].mobility,ue[18].mobility,ue[19].mobility,ue[20].mobility,ue[21].mobility,ue[22].mobility,ue[23].mobility,ue[24].mobility,ue[25].mobility,ue[26].mobility,ue[27].mobility,ue[28].mobility,ue[29].mobility,ue[30].mobility,ue[31].mobility,ue[32].mobility,ue[33].mobility,ue[34].mobility,ue[35].mobility,ue[36].mobility,ue[37].mobility,ue[38].mobility,ue[39].mobility,ue[40].mobility,ue[41].mobility,ue[42].mobility,ue[43].mobility,ue[44].mobility,ue[45].mobility,ue[46].mobility,ue[47].mobility,gnb[0].mobility,gnb[1].mobility,gnb[2].mobility,gnb[3].mobility"

# ===========================================================================
# POSITION DES 4 gNBs
# ===========================================================================
*.gnb[0].mobility.typename = "StationaryMobility"
*.gnb[0].mobility.initialX = 250m
*.gnb[0].mobility.initialY = 250m
*.gnb[0].mobility.initialZ = 30m

*.gnb[1].mobility.typename = "StationaryMobility"
*.gnb[1].mobility.initialX = 750m
*.gnb[1].mobility.initialY = 250m
*.gnb[1].mobility.initialZ = 30m

*.gnb[2].mobility.typename = "StationaryMobility"
*.gnb[2].mobility.initialX = 250m
*.gnb[2].mobility.initialY = 750m
*.gnb[2].mobility.initialZ = 30m

*.gnb[3].mobility.typename = "StationaryMobility"
*.gnb[3].mobility.initialX = 750m
*.gnb[3].mobility.initialY = 750m
*.gnb[3].mobility.initialZ = 30m

# ===========================================================================
# ASSOCIATION DES UEs AUX 4 gNBs
# ===========================================================================
*.gnb[0].masterId = 1
*.gnb[0].macCellId = 1
*.gnb[0].nrMasterId = 1
*.gnb[0].nrMacCellId = 1

*.gnb[1].masterId = 2
*.gnb[1].macCellId = 2
*.gnb[1].nrMasterId = 2
*.gnb[1].nrMacCellId = 2

*.gnb[2].masterId = 3
*.gnb[2].macCellId = 3
*.gnb[2].nrMasterId = 3
*.gnb[2].nrMacCellId = 3

*.gnb[3].masterId = 4
*.gnb[3].macCellId = 4
*.gnb[3].nrMasterId = 4
*.gnb[3].nrMacCellId = 4

*.ue[0..11].masterId = 1
*.ue[0..11].macCellId = 1
*.ue[0..11].nrMasterId = 1
*.ue[0..11].nrMacCellId = 1

*.ue[12..23].masterId = 2
*.ue[12..23].macCellId = 2
*.ue[12..23].nrMasterId = 2
*.ue[12..23].nrMacCellId = 2

*.ue[24..35].masterId = 3
*.ue[24..35].macCellId = 3
*.ue[24..35].nrMasterId = 3
*.ue[24..35].nrMacCellId = 3

*.ue[36..47].masterId = 4
*.ue[36..47].macCellId = 4
*.ue[36..47].nrMasterId = 4
*.ue[36..47].nrMacCellId = 4

# ===========================================================================
# SC05 TRAFFIC + FAST MOBILITY PATTERNS
# Types conservés : EXPONENTIAL, DETERMINISTIC, UNIFORM, ONOFF, PPBP
# Mobilités conservées : GaussMarkov, Linear, Circle
# ===========================================================================

# ---------------------------------------------------------------------------
# UEs 0..11 : EXPONENTIAL DL + GaussMarkov rapide autour gNB0
# ---------------------------------------------------------------------------
*.server.app[0..11].typename = "UdpBasicApp"
*.server.app[0..11].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[0..11].destPort = 1000
*.server.app[0..11].messageLength = 1450B
*.server.app[0..11].sendInterval = exponential(0.001s)
*.ue[0..11].app[0].typename = "UdpSink"

*.ue[0..11].mobility.typename = "GaussMarkovMobility"
*.ue[0..11].mobility.initialX = uniform(100m, 400m)
*.ue[0..11].mobility.initialY = uniform(100m, 400m)
*.ue[0..11].mobility.speed = uniform(20mps, 40mps)

# ---------------------------------------------------------------------------
# UEs 12..23 : DETERMINISTIC UL + Linear rapide autour gNB1
# ---------------------------------------------------------------------------
*.ue[12..23].app[0].typename = "UdpBasicApp"
*.ue[12..23].app[0].destAddresses = "server"
*.ue[12..23].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[12..23].app[0].messageLength = 1450B
*.ue[12..23].app[0].sendInterval = 0.001s
*.server.app[12..23].typename = "UdpSink"

*.ue[12..23].mobility.typename = "LinearMobility"
*.ue[12..23].mobility.initialX = uniform(600m, 900m)
*.ue[12..23].mobility.initialY = uniform(100m, 400m)
*.ue[12..23].mobility.speed = uniform(25mps, 45mps)
*.ue[12..23].mobility.angle = uniform(0deg, 360deg)

# ---------------------------------------------------------------------------
# UEs 24..35 : UNIFORM DL + Circle mobilité rapide autour gNB2
# ---------------------------------------------------------------------------
*.server.app[24..35].typename = "UdpBasicApp"
*.server.app[24..35].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[24..35].destPort = 1000
*.server.app[24..35].messageLength = 1450B
*.server.app[24..35].sendInterval = uniform(0.001s, 0.005s)
*.ue[24..35].app[0].typename = "UdpSink"

*.ue[24..35].mobility.typename = "CircleMobility"
*.ue[24..35].mobility.cx = 250m
*.ue[24..35].mobility.cy = 750m
*.ue[24..35].mobility.r = 180m
*.ue[24..35].mobility.speed = 25mps

# ---------------------------------------------------------------------------
# UEs 36..41 : ONOFF DL + GaussMarkov très rapide autour gNB3
# ---------------------------------------------------------------------------
*.server.app[36..41].typename = "UdpBasicApp"
*.server.app[36..41].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[36..41].destPort = 1000
*.server.app[36..41].messageLength = 1450B
*.server.app[36..41].sendInterval = uniform(0,1) < 0.8 ? 0.0002s : 0.4s
*.ue[36..41].app[0].typename = "UdpSink"

*.ue[36..41].mobility.typename = "GaussMarkovMobility"
*.ue[36..41].mobility.initialX = uniform(600m, 900m)
*.ue[36..41].mobility.initialY = uniform(600m, 900m)
*.ue[36..41].mobility.speed = uniform(30mps, 60mps)

# ---------------------------------------------------------------------------
# UEs 42..47 : PPBP DL + Linear très rapide autour gNB3
# ---------------------------------------------------------------------------
*.server.app[42..47].typename = "UdpBasicApp"
*.server.app[42..47].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[42..47].destPort = 1000
*.server.app[42..47].messageLength = 1450B
*.server.app[42..47].sendInterval = pareto(0.001s, 1.3)
*.ue[42..47].app[0].typename = "UdpSink"

*.ue[42..47].mobility.typename = "LinearMobility"
*.ue[42..47].mobility.initialX = uniform(600m, 900m)
*.ue[42..47].mobility.initialY = uniform(600m, 900m)
*.ue[42..47].mobility.speed = uniform(35mps, 70mps)
*.ue[42..47].mobility.angle = uniform(0deg, 360deg)