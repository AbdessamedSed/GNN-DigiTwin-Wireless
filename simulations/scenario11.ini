[General]
network = src.FiveGNetwork
sim-time-limit = 100s
scheduler-class = "omnetpp::cRealTimeScheduler"

# --- Chemins ---
ned-path = ../src:../../Simu5G/src:../../inet4.5/src


# --- Config Réseau ---
*.configurator.typename = "Ipv4NetworkConfigurator"
*.configurator.addDefaultRoutes = true

# ---------------------------------------------------------------------------
# BLINDAGE ANTI-DIALOGUE ET ANTI-PORT (Pour exécution en batch)
# ---------------------------------------------------------------------------
# IDs Réseau (Bloque les pop-ups MasterId)
**.masterId = 1
**.macCellId = 1
**.nrMasterId = 1
**.nrMacCellId = 1

# Paramètres de Mobilité (Bloque les pop-ups de configuration)
**.initialZ = 0m
**.mobility.initFromDisplayString = false
**.mobility.updateInterval = 0.01s
**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 100m
**.speedStdDev = 0mps
**.angleStdDev = 0deg
**.alpha = 0.5
**.margin = 10m

# Configuration des ports pour éviter les assignations automatiques conflictuelles
*.server.app[*].localPort = -1
*.ue[*].app[0].localPort = 1000
**.destPort = 1000

# Démarrage et arrêt des applications
**.startTime = 0.1s
**.stopTime = -1s # -1 signifie jusqu'à la fin de la simulation

[Config Statistics]


# Configuration de base pour la physique du canal radio
**.channelModel = "UMA"
#**.pathlossModel = "P3GPP38901"
#**.transmitter.power = 0.01W
#**.cellularNic.phy.receiver.noiseFigure = 5dB

# ---------------------------------------------------------------------------
# VARIATIONS POUR L'APPRENTISSAGE (Généralisation)
# ---------------------------------------------------------------------------

# OMNeT++ va itérer sur ces combinaisons pour générer différents jeux de données
**.gnb[*].cellularNic.phy.transmitter.power = 0.1W
**.gnb[*].cellularNic.mac.schedulingDisciplineDl = "MAXCI"
**.gnb[*].cellularNic.mac.schedulingDisciplineUl = "MAXCI"
**.gnb[*].cellularNic.numBands = 50

# Variation de la taille des files d'attente RLC et MAC
**.rlc.um.queueSize = 2MiB
**.mac.queueSize = 2MiB

# ---------------------------------------------------------------------------
# CONFIGURATION DU SCÉNARIO 5 UEs
# ---------------------------------------------------------------------------
[Config DT-Scenario]
# ---------------------------------------------------------------------------
# SCÉNARIO 1.1 : THE STATIC ANCHOR (20 UEs, Low Mobility, Stable Traffic)
# ---------------------------------------------------------------------------

# 1. Nombre de Noeuds
*.numUe = 20
*.numGnb = 1

*.dtConnector.numMobilityModules = 21 

# 5. Configuration du DTConnector (Monitoring des 20 UEs)
# On donne au connecteur la liste de tous les modules de mobilité à surveiller
*.dtConnector.samplingInterval = 0.01s # Intervalle interne OMNeT
*.dtConnector.mobilityModulePaths = "ue[0].mobility,ue[1].mobility,ue[2].mobility,ue[3].mobility,ue[4].mobility,ue[5].mobility,ue[6].mobility,ue[7].mobility,ue[8].mobility,ue[9].mobility,ue[10].mobility,ue[11].mobility,ue[12].mobility,ue[13].mobility,ue[14].mobility,ue[15].mobility,ue[16].mobility,ue[17].mobility,ue[18].mobility,ue[19].mobility,gnb[0].mobility"

# ---------------------------------------------------------------------------

# 2. Mobilité des UEs (Petites vitesses : 0.1 à 0.5 m/s)
# On les place de manière fixe ou aléatoire autour du gNB
**.ue[*].mobility.typename = "LinearMobility"
**.ue[*].mobility.initialX = uniform(400m, 600m)
**.ue[*].mobility.initialY = uniform(400m, 600m)
**.ue[*].mobility.initialZ = 1.5m
**.ue[*].mobility.speed = uniform(0.1mps, 0.5mps) 
**.ue[*].mobility.angle = uniform(0deg, 360deg)

**.gnb[0].mobility.typename = "StationaryMobility"
**.gnb[0].mobility.initialX = 500m
**.gnb[0].mobility.initialY = 500m
**.gnb[0].mobility.initialZ = 30m

# 4. Trafic Applicatif (Stable : Server -> 20 UEs)
# Le serveur envoie un flux UDP constant à chaque UE
*.server.numApps = 20
*.server.app[*].typename = "UdpBasicApp"
*.server.app[0].destAddresses = "ue[0]"
*.server.app[1].destAddresses = "ue[1]"
*.server.app[2].destAddresses = "ue[2]"
*.server.app[3].destAddresses = "ue[3]"
*.server.app[4].destAddresses = "ue[4]"
*.server.app[5].destAddresses = "ue[5]"
*.server.app[6].destAddresses = "ue[6]"
*.server.app[7].destAddresses = "ue[7]"
*.server.app[8].destAddresses = "ue[8]"
*.server.app[9].destAddresses = "ue[9]"
*.server.app[10].destAddresses = "ue[10]"
*.server.app[11].destAddresses = "ue[11]"
*.server.app[12].destAddresses = "ue[12]"
*.server.app[13].destAddresses = "ue[13]"
*.server.app[14].destAddresses = "ue[14]"
*.server.app[15].destAddresses = "ue[15]"
*.server.app[16].destAddresses = "ue[16]"
*.server.app[17].destAddresses = "ue[17]"
*.server.app[18].destAddresses = "ue[18]"
*.server.app[19].destAddresses = "ue[19]"

# Paramètres du flux (1000 octets toutes les 20ms = 400 kbps par UE)
*.server.app[*].messageLength = 1000B
*.server.app[*].sendInterval = 20ms

# Fin de la configuration Scenario 1.1
# ---------------------------------------------------------------------------