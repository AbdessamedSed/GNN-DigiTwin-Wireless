# Traffic and mobility patterns
# Types conserved: EXPONENTIAL, DETERMINISTIC, UNIFORM, ONOFF, PPBP
# Mobilities conserved: GaussMarkov, Linear, Circle

# UEs 0..9: EXPONENTIAL + GaussMarkov around gNB0
*.server.app[0..9].typename = "UdpBasicApp"
*.server.app[0..9].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[0..9].destPort = 1000
*.server.app[0..9].messageLength = 1450B
*.server.app[0..9].sendInterval = exponential(0.001s)
*.ue[0..9].app[0].typename = "UdpSink"

*.ue[0..9].mobility.typename = "GaussMarkovMobility"
*.ue[0..9].mobility.initialX = uniform(100m, 400m)
*.ue[0..9].mobility.initialY = uniform(100m, 400m)
*.ue[0..9].mobility.speed = uniform(20mps, 40mps)

