[General]
network = src.FiveGNetwork
sim-time-limit = 120s
#scheduler-class = "omnetpp::cRealTimeScheduler"

# --- Chemins 
ned-path = ../src:../../Simu5G/src:../../inet4.5/src

# --- Config Réseau ---
*.configurator.typename = "Ipv4NetworkConfigurator"
*.configurator.addDefaultRoutes = true

# ---------------------------------------------------------------------------
# BLINDAGE TOTAL ANTI-DIALOGUE ET ANTI-PORT
# ---------------------------------------------------------------------------   
#**.masterId = 1
#**.macCellId = 1
#**.nrMasterId = 1
#**.nrMacCellId = 1


**.initialZ = 0m
**.mobility.initFromDisplayString = false
**.mobility.updateInterval = 0.01s
**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 2000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 2000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 500m
**.speedStdDev = 0mps
**.angleStdDev = 0deg
**.alpha = 0.5
**.margin = 10m

*.server.app[*].localPort = 1000 + ancestorIndex(0)
*.ue[*].app[0].localPort = 1000
**.startTime = 0.5s
**.stopTime = -1s

[Config Statistics]
**.channelModel = "UMA"
**.pathlossModel = "P3GPP38901"
**.transmitter.power = 0.01W
**.cellularNic.phy.receiver.noiseFigure = 5dB

# ---------------------------------------------------------------------------
# VARIATIONS POUR L'APPRENTISSAGE DU GNN (Généralisation)
# ---------------------------------------------------------------------------
**.gnb[*].nic.phy.transmitter.power = ${power=0.01W, 0.1W, 0.5W, 2W}
**.gnb[*].cellularNic.mac.schedulingDisciplineDl = ${sched="PF","MAXCI","DRR", "QOS_PF", "MAXCI_MB", "ALLOCATOR_BESTFIT"}
**.gnb[*].cellularNic.mac.schedulingDisciplineUl = ${sched}
**.gnb[*].cellularNic.numBands = 50

**.rlc.um.queueSize = ${qSize= 50KiB, 100KiB, 2MiB, 10MiB}
**.mac.queueSize = ${qSize}

# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------

[Config DT-Scenario]

extends = Statistics

# 1. INITIALISATION DES NODES
*.numUe = 75
*.numGnb = 3

# 2. FIX DE L'ERREUR MASTERID (Assignation globale immédiate)
# On force l'ID par défaut pour TOUS les UEs avant de spécialiser
*.ue[*].masterId = 1
*.ue[*].macCellId = 1
*.ue[*].nrMasterId = 1
*.ue[*].nrMacCellId = 1

# 3. POSITION ET CONFIGURATION DES gNBs
*.gnb[0].mobility.initialX = 950m
*.gnb[0].mobility.initialY = 950m
*.gnb[0].macCellId = 1
*.gnb[0].nrMacCellId = 1

*.gnb[1].mobility.initialX = 1050m
*.gnb[1].mobility.initialY = 950m
*.gnb[1].macCellId = 2
*.gnb[1].nrMacCellId = 2

*.gnb[2].mobility.initialX = 1000m
*.gnb[2].mobility.initialY = 1050m
*.gnb[2].macCellId = 3
*.gnb[2].nrMacCellId = 3

**.gnb[*].mobility.typename = "StationaryMobility"
**.gnb[*].mobility.initialZ = 30m

# 4. RÉPARTITION DES UEs SUR LES gNBs (Surcharge)
# gNB 0 (0-24) -> déjà fait par le défaut ci-dessus
# gNB 1 (25-49)
*.ue[25..49].masterId = 2
*.ue[25..49].macCellId = 2
*.ue[25..49].nrMasterId = 2
*.ue[25..49].nrMacCellId = 2
# gNB 2 (50-74)
*.ue[50..74].masterId = 3
*.ue[50..74].macCellId = 3
*.ue[50..74].nrMasterId = 3
*.ue[50..74].nrMacCellId = 3

# 5. CONFIGURATION DES APPLICATIONS (FIX TYPENAME)
*.server.numApps = 75
*.ue[*].numApps = 1

# On définit d'abord les types pour tout le monde
*.server.app[*].typename = "UdpSink"
*.ue[*].app[0].typename = "UdpSink"

# Surcharge pour les émetteurs
*.server.app[0..7, 25..32, 50..57].typename = "UdpBasicApp"   # eMBB Downlink
*.ue[8..24, 33..49, 58..74].app[0].typename = "UdpBasicApp"  # URLLC/mMTC Uplink

# Configuration des ports et adresses
*.server.app[*].localPort = 1000 + ancestorIndex(0)
*.ue[*].app[0].localPort = 1000
**.startTime = 0.5s

# 6. MOBILITÉ : Zone d'interférence centrale
**.ue[*].mobility.typename = "RandomWaypointMobility"
**.ue[*].mobility.speed = uniform(1mps, 5mps)
**.ue[*].mobility.updateInterval = 0.1s
**.ue[*].mobility.constraintAreaMinX = 850m
**.ue[*].mobility.constraintAreaMaxX = 1150m
**.ue[*].mobility.constraintAreaMinY = 850m
**.ue[*].mobility.constraintAreaMaxY = 1150m
**.initialZ = 0m

# 7. CONNECTEUR DIGITAL TWIN
*.dtConnector.numMobilityModules = 78
*.dtConnector.samplingInterval = 0.1s
*.dtConnector.mobilityModulePaths = "ue[*].mobility,gnb[*].mobility"

# ===========================================================================
# TRAFFICS (DETERMINISTIC, EXPONENTIAL, NORMAL, ONOFF)
# ===========================================================================

# eMBB (Normal)
*.server.app[0..7, 25..32, 50..57].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[0..7, 25..32, 50..57].destPort = 1000
*.server.app[0..7, 25..32, 50..57].messageLength = int(normal(1200, 200)) * 1B
*.server.app[0..7, 25..32, 50..57].sendInterval = 0.005s

# URLLC (Exponential)
*.ue[8..15, 33..40, 58..65].app[0].destAddresses = "server"
*.ue[8..15, 33..40, 58..65].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[8..15, 33..40, 58..65].app[0].messageLength = 64B
*.ue[8..15, 33..40, 58..65].app[0].sendInterval = exponential(0.1s)

# mMTC (OnOff)
*.ue[16..24, 41..49, 66..74].app[0].destAddresses = "server"
*.ue[16..24, 41..49, 66..74].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[16..24, 41..49, 66..74].app[0].messageLength = int(uniform(50, 100)) * 1B
*.ue[16..24, 41..49, 66..74].app[0].sendInterval = (uniform(0,1) < 0.1 ? 0.05s : 5s)