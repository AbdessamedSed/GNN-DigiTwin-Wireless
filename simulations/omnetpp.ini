[General]
network = src.FiveGNetwork
sim-time-limit = 120s
#scheduler-class = "omnetpp::cRealTimeScheduler"

# --- Chemins ---
ned-path = ../src:../../Simu5G/src:../../inet4.5/src

# --- Config Réseau ---
*.configurator.typename = "Ipv4NetworkConfigurator"
*.configurator.addDefaultRoutes = true

# Désactiver les gros fichiers .vec/.sca OMNeT++
**.vector-recording = false
**.scalar-recording = false

# ---------------------------------------------------------------------------
# BLINDAGE TOTAL ANTI-DIALOGUE ET ANTI-PORT
# ---------------------------------------------------------------------------
**.masterId = 1
**.macCellId = 1
**.nrMasterId = 1
**.nrMacCellId = 1

# Délais de transmission
**.server.ppp[*].**.delay = 50ms
**.gnb[*].ppp[*].**.delay = 50ms

# Paramètres de Mobilité Globaux
**.initialZ = 0m
**.mobility.initFromDisplayString = false
**.mobility.updateInterval = 0.01s
**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 100m
**.speedStdDev = 0mps
**.angleStdDev = 0deg
**.alpha = 0.5
**.margin = 10m

# --- CORRECTION DES PORTS ---
*.server.app[*].localPort = 1000 + ancestorIndex(0)
*.ue[*].app[0].localPort = 1000
**.startTime = 0.1s
**.stopTime = -1s

[Config Statistics]
**.channelModel = "UMA"
**.pathlossModel = "P3GPP38901"
**.transmitter.power = 0.01W
**.cellularNic.phy.receiver.noiseFigure = 5dB

# ---------------------------------------------------------------------------
# VARIATIONS POUR L'APPRENTISSAGE DU GNN
# ---------------------------------------------------------------------------
**.gnb[*].nic.phy.transmitter.power = ${power=0.01W, 0.1W, 0.5W, 2W}
**.gnb[*].cellularNic.mac.schedulingDisciplineDl = ${sched="PF","MAXCI","DRR","QOS_PF","MAXCI_MB","ALLOCATOR_BESTFIT"}
**.gnb[*].cellularNic.mac.schedulingDisciplineUl = ${sched}
**.gnb[*].cellularNic.numBands = 50

**.rlc.um.queueSize = ${qSize=50KiB, 100KiB, 2MiB, 10MiB}
**.mac.queueSize = ${qSize}

# ---------------------------------------------------------------------------
# SC08 : 30 UEs, 2 gNBs, CONTROLLED TOPOLOGY
# Controlled topology with scheduler, queue-size, and power variation.
# ---------------------------------------------------------------------------
[Config DT-Scenario]
extends = Statistics

*.numUe = 30
*.numGnb = 2
*.server.numApps = 30
*.ue[*].numApps = 1

*.dtConnector.numMobilityModules = 32
*.dtConnector.samplingInterval = 0.1s
*.dtConnector.mobilityModulePaths = "ue[0].mobility,ue[1].mobility,ue[2].mobility,ue[3].mobility,ue[4].mobility,ue[5].mobility,ue[6].mobility,ue[7].mobility,ue[8].mobility,ue[9].mobility,ue[10].mobility,ue[11].mobility,ue[12].mobility,ue[13].mobility,ue[14].mobility,ue[15].mobility,ue[16].mobility,ue[17].mobility,ue[18].mobility,ue[19].mobility,ue[20].mobility,ue[21].mobility,ue[22].mobility,ue[23].mobility,ue[24].mobility,ue[25].mobility,ue[26].mobility,ue[27].mobility,ue[28].mobility,ue[29].mobility,gnb[0].mobility,gnb[1].mobility"

# ===========================================================================
# POSITION DES 2 gNBs
# ===========================================================================
*.gnb[0].mobility.typename = "StationaryMobility"
*.gnb[0].mobility.initialX = 300m
*.gnb[0].mobility.initialY = 500m
*.gnb[0].mobility.initialZ = 30m

*.gnb[1].mobility.typename = "StationaryMobility"
*.gnb[1].mobility.initialX = 700m
*.gnb[1].mobility.initialY = 500m
*.gnb[1].mobility.initialZ = 30m

# ===========================================================================
# ASSOCIATION DES UEs AUX 2 gNBs
# 15 UEs par gNB
# ===========================================================================
*.gnb[0].masterId = 1
*.gnb[0].macCellId = 1
*.gnb[0].nrMasterId = 1
*.gnb[0].nrMacCellId = 1

*.gnb[1].masterId = 2
*.gnb[1].macCellId = 2
*.gnb[1].nrMasterId = 2
*.gnb[1].nrMacCellId = 2

*.ue[0..14].masterId = 1
*.ue[0..14].macCellId = 1
*.ue[0..14].nrMasterId = 1
*.ue[0..14].nrMacCellId = 1

*.ue[15..29].masterId = 2
*.ue[15..29].macCellId = 2
*.ue[15..29].nrMasterId = 2
*.ue[15..29].nrMacCellId = 2

# ===========================================================================
# SC08 TRAFFIC + CONTROLLED TOPOLOGY
# Types conservés : EXPONENTIAL, DETERMINISTIC, UNIFORM, ONOFF, PPBP
# Mobilité contrôlée : StationaryMobility
# ===========================================================================

# ---------------------------------------------------------------------------
# UEs 0..5 : EXPONENTIAL DL, gNB0
# ---------------------------------------------------------------------------
*.server.app[0..5].typename = "UdpBasicApp"
*.server.app[0..5].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[0..5].destPort = 1000
*.server.app[0..5].messageLength = 1450B
*.server.app[0..5].sendInterval = exponential(0.0015s)
*.ue[0..5].app[0].typename = "UdpSink"

*.ue[0..2].mobility.typename = "StationaryMobility"
*.ue[0..2].mobility.initialX = uniform(180m, 320m)
*.ue[0..2].mobility.initialY = uniform(400m, 600m)

*.ue[3..5].mobility.typename = "StationaryMobility"
*.ue[3..5].mobility.initialX = uniform(430m, 500m)
*.ue[3..5].mobility.initialY = uniform(400m, 600m)

# ---------------------------------------------------------------------------
# UEs 6..11 : DETERMINISTIC UL, gNB0, buffer pressure
# ---------------------------------------------------------------------------
*.ue[6..11].app[0].typename = "UdpBasicApp"
*.ue[6..11].app[0].destAddresses = "server"
*.ue[6..11].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[6..11].app[0].messageLength = 1450B
*.ue[6..11].app[0].sendInterval = 0.001s
*.server.app[6..11].typename = "UdpSink"

*.ue[6..8].mobility.typename = "StationaryMobility"
*.ue[6..8].mobility.initialX = uniform(180m, 320m)
*.ue[6..8].mobility.initialY = uniform(300m, 700m)

*.ue[9..11].mobility.typename = "StationaryMobility"
*.ue[9..11].mobility.initialX = uniform(430m, 500m)
*.ue[9..11].mobility.initialY = uniform(300m, 700m)

# ---------------------------------------------------------------------------
# UEs 12..17 : UNIFORM DL, transition entre gNB0 et gNB1
# ---------------------------------------------------------------------------
*.server.app[12..17].typename = "UdpBasicApp"
*.server.app[12..17].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[12..17].destPort = 1000
*.server.app[12..17].messageLength = 1450B
*.server.app[12..17].sendInterval = uniform(0.001s, 0.004s)
*.ue[12..17].app[0].typename = "UdpSink"

*.ue[12..14].mobility.typename = "StationaryMobility"
*.ue[12..14].mobility.initialX = uniform(450m, 520m)
*.ue[12..14].mobility.initialY = uniform(350m, 650m)

*.ue[15..17].mobility.typename = "StationaryMobility"
*.ue[15..17].mobility.initialX = uniform(480m, 550m)
*.ue[15..17].mobility.initialY = uniform(350m, 650m)

# ---------------------------------------------------------------------------
# UEs 18..23 : ONOFF DL, gNB1, bursty load
# ---------------------------------------------------------------------------
*.server.app[18..23].typename = "UdpBasicApp"
*.server.app[18..23].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[18..23].destPort = 1000
*.server.app[18..23].messageLength = 1450B
*.server.app[18..23].sendInterval = uniform(0,1) < 0.8 ? 0.0005s : 0.25s
*.ue[18..23].app[0].typename = "UdpSink"

*.ue[18..20].mobility.typename = "StationaryMobility"
*.ue[18..20].mobility.initialX = uniform(680m, 820m)
*.ue[18..20].mobility.initialY = uniform(300m, 700m)

*.ue[21..23].mobility.typename = "StationaryMobility"
*.ue[21..23].mobility.initialX = uniform(500m, 570m)
*.ue[21..23].mobility.initialY = uniform(300m, 700m)

# ---------------------------------------------------------------------------
# UEs 24..29 : PPBP DL, gNB1, heavy-tailed load
# ---------------------------------------------------------------------------
*.server.app[24..29].typename = "UdpBasicApp"
*.server.app[24..29].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[24..29].destPort = 1000
*.server.app[24..29].messageLength = 1450B
*.server.app[24..29].sendInterval = pareto(0.0015s, 1.3)
*.ue[24..29].app[0].typename = "UdpSink"

*.ue[24..26].mobility.typename = "StationaryMobility"
*.ue[24..26].mobility.initialX = uniform(680m, 820m)
*.ue[24..26].mobility.initialY = uniform(400m, 600m)

*.ue[27..29].mobility.typename = "StationaryMobility"
*.ue[27..29].mobility.initialX = uniform(500m, 570m)
*.ue[27..29].mobility.initialY = uniform(400m, 600m)