# ===========================================================================
# 1. TRANCHE eMBB (UEs 0 à 32) - Haut Débit, Gros Paquets
# ===========================================================================
# Trafic varié : NORMAL (Vidéo), DETERMINISTIC (Téléchargement), UNIFORM (Web)

# UE 0-15: Downlink Vidéo (NORMAL distribution pour taille de paquets)
*.server.app[0..15].typename = "UdpBasicApp"
*.server.app[0..15].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[0..15].destPort = 1000
*.server.app[0..15].messageLength = int(normal(1200, 200)) * 1B
*.server.app[0..15].sendInterval = 0.005s 
*.ue[0..15].app[0].typename = "UdpSink"
*.ue[0..15].mobility.typename = "GaussMarkovMobility"
*.ue[0..15].mobility.speed = uniform(10mps, 20mps)

# UE 16-32: Uplink File Transfer (DETERMINISTIC)
*.ue[16..32].app[0].typename = "UdpBasicApp"
*.ue[16..32].app[0].destAddresses = "server"
*.ue[16..32].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[16..32].app[0].messageLength = 1450B
*.ue[16..32].app[0].sendInterval = 0.002s
*.server.app[16..32].typename = "UdpSink"
*.ue[16..32].mobility.typename = "LinearMobility"
*.ue[16..32].mobility.speed = 15mps

# ===========================================================================
# 2. TRANCHE URLLC (UEs 33 à 65) - Ultra Fiable, Latence Critique
# ===========================================================================
# Trafic varié : EXPONENTIAL (Alertes), DETERMINISTIC (Contrôle temps réel)

# UE 33-48: Downlink Control (EXPONENTIAL intervalle, petite taille)

*.ue[33..65].app[0].typename = "UdpBasicApp"
*.ue[33..65].app[0].destAddresses = "server"
*.ue[33..65].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[33..65].app[0].messageLength = 100B
*.ue[33..65].app[0].sendInterval = exponential(0.01s)
*.server.app[33..65].typename = "UdpSink"
**.ue[33..65].mobility.typename = "CircleMobility"
**.ue[33..65].mobility.cx = (parentIndex() < 50 ? 500m : 1500m)
**.ue[33..65].mobility.cy = (parentIndex() % 2 == 0 ? 500m : 1500m)
**.ue[33..65].mobility.r = 30m
*.ue[33..48].mobility.speed = 5mps


# UE 49-65: Uplink Critical Feedback (DETERMINISTIC)
*.ue[49..65].app[0].typename = "UdpBasicApp"
*.ue[49..65].app[0].destAddresses = "server"
*.ue[49..65].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[49..65].app[0].messageLength = 64B
*.ue[49..65].app[0].sendInterval = 0.001s # Très fréquent (1ms)
*.server.app[49..65].typename = "UdpSink"
*.ue[49..65].mobility.typename = "StationaryMobility"
*.ue[49..65].mobility.initialX = uniform(100m, 1900m)
*.ue[49..65].mobility.initialY = uniform(100m, 1900m)

# ===========================================================================
# 3. TRANCHE mMTC (UEs 66 à 99) - Capteurs Massifs, Bas Débit
# ===========================================================================
# Trafic varié : ONOFF (Rafales), UNIFORM (Reports), EXPONENTIAL (Alarmes)

# UE 66-80: Uplink Sensor Burst (ONOFF style RouteNet)
*.ue[66..80].app[0].typename = "UdpBasicApp"
*.ue[66..80].app[0].destAddresses = "server"
*.ue[66..80].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[66..80].app[0].messageLength = 128B
# Switch ON/OFF : Actif 10% du temps
*.ue[66..80].app[0].sendInterval = (uniform(0,1) < 0.1 ? 0.05s : 5s)
*.server.app[66..80].typename = "UdpSink"
*.ue[66..80].mobility.typename = "StationaryMobility"

# UE 81-99: Uplink Periodic Reports (UNIFORM intervalle pour éviter la congestion massive simultanée)
*.ue[81..99].app[0].typename = "UdpBasicApp"
*.ue[81..99].app[0].destAddresses = "server"
*.ue[81..99].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[81..99].app[0].messageLength = 50B
*.ue[81..99].app[0].sendInterval = uniform(1s, 2s)
*.server.app[81..99].typename = "UdpSink"
*.ue[81..99].mobility.typename = "LinearMobility"
*.ue[81..99].mobility.speed = 1mps # Piétons très lents