[General]
network = src.FiveGNetwork
sim-time-limit = 120s
#scheduler-class = "omnetpp::cRealTimeScheduler"

# --- Chemins ---
ned-path = ../src:../../Simu5G/src:../../inet4.5/src

# --- Config Réseau ---
*.configurator.typename = "Ipv4NetworkConfigurator"
*.configurator.addDefaultRoutes = true

# ---------------------------------------------------------------------------
# BLINDAGE TOTAL ANTI-DIALOGUE ET ANTI-PORT
# ---------------------------------------------------------------------------
**.masterId = 1
**.macCellId = 1
**.nrMasterId = 1
**.nrMacCellId = 1

# Délais de transmission
**.server.ppp[*].**.delay = 50ms
**.gnb[0].ppp[*].**.delay = 50ms

# Paramètres de Mobilité Globaux
**.initialZ = 0m
**.mobility.initFromDisplayString = false
**.mobility.updateInterval = 0.01s
**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 100m
**.speedStdDev = 0mps
**.angleStdDev = 0deg
**.alpha = 0.5
**.margin = 10m

# --- CORRECTION DES PORTS ---
*.server.app[*].localPort = 1000 + ancestorIndex(0)
*.ue[*].app[0].localPort = 1000
**.startTime = 0.1s
**.stopTime = -1s

[Config Statistics]
**.channelModel = "UMA"
**.pathlossModel = "P3GPP38901"
**.transmitter.power = 0.01W
**.cellularNic.phy.receiver.noiseFigure = 5dB

# ---------------------------------------------------------------------------
# VARIATIONS POUR L'APPRENTISSAGE DU GNN
# ---------------------------------------------------------------------------
**.gnb[*].nic.phy.transmitter.power = ${power=0.01W, 0.1W, 0.5W, 2W}
**.gnb[*].cellularNic.mac.schedulingDisciplineDl = ${sched="PF","MAXCI","DRR","QOS_PF","MAXCI_MB","ALLOCATOR_BESTFIT"}
**.gnb[*].cellularNic.mac.schedulingDisciplineUl = ${sched}
**.gnb[*].cellularNic.numBands = 50

**.rlc.um.queueSize = ${qSize=50KiB, 100KiB, 2MiB, 10MiB}
**.mac.queueSize = ${qSize}

# ---------------------------------------------------------------------------
# CONFIGURATION DU SCÉNARIO 30 UEs eMBB TEST_2
# ---------------------------------------------------------------------------
[Config DT-Scenario]
extends = Statistics

*.numUe = 30
*.numGnb = 1
*.server.numApps = 30
*.ue[*].numApps = 1

*.dtConnector.numMobilityModules = 31
*.dtConnector.samplingInterval = 0.1s
*.dtConnector.mobilityModulePaths = "ue[0].mobility,ue[1].mobility,ue[2].mobility,ue[3].mobility,ue[4].mobility,ue[5].mobility,ue[6].mobility,ue[7].mobility,ue[8].mobility,ue[9].mobility,ue[10].mobility,ue[11].mobility,ue[12].mobility,ue[13].mobility,ue[14].mobility,ue[15].mobility,ue[16].mobility,ue[17].mobility,ue[18].mobility,ue[19].mobility,ue[20].mobility,ue[21].mobility,ue[22].mobility,ue[23].mobility,ue[24].mobility,ue[25].mobility,ue[26].mobility,ue[27].mobility,ue[28].mobility,ue[29].mobility,gnb[0].mobility"

# Position du gNB fixe
*.gnb[0].mobility.typename = "StationaryMobility"
*.gnb[0].mobility.initialX = 500m
*.gnb[0].mobility.initialY = 500m
*.gnb[0].mobility.initialZ = 30m

# ===========================================================================
# DÉFINITION DES TRAFICS ET MOBILITÉS eMBB POUR 30 UEs
# Même types de trafic et mobilité que la logique originale.
# ===========================================================================

# --- [EXPONENTIAL] : UEs 0,1,2 et 15,16,17 Downlink ---
*.server.app[0..2].typename = "UdpBasicApp"
*.server.app[0..2].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[0..2].destPort = 1000
*.server.app[0..2].messageLength = 1450B
*.server.app[0..2].sendInterval = exponential(0.001s)
*.ue[0..2].app[0].typename = "UdpSink"
*.ue[0..2].mobility.typename = "GaussMarkovMobility"
*.ue[0..2].mobility.speed = uniform(10mps, 20mps)

*.server.app[15..17].typename = "UdpBasicApp"
*.server.app[15..17].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[15..17].destPort = 1000
*.server.app[15..17].messageLength = 1450B
*.server.app[15..17].sendInterval = exponential(0.001s)
*.ue[15..17].app[0].typename = "UdpSink"
*.ue[15..17].mobility.typename = "GaussMarkovMobility"
*.ue[15..17].mobility.speed = uniform(10mps, 20mps)

# --- [DETERMINISTIC] : UEs 3,4 et 18,19 Uplink ---
*.ue[3..4].app[0].typename = "UdpBasicApp"
*.ue[3..4].app[0].destAddresses = "server"
*.ue[3..4].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[3..4].app[0].messageLength = 1450B
