[General]
network = src.FiveGNetwork
sim-time-limit = 120s
#scheduler-class = "omnetpp::cRealTimeScheduler"

# --- Chemins (Identiques) ---
ned-path = ../src:../../Simu5G/src:../../inet4.5/src

# --- Config Réseau ---
*.configurator.typename = "Ipv4NetworkConfigurator"
*.configurator.addDefaultRoutes = true

# ---------------------------------------------------------------------------
# BLINDAGE TOTAL ANTI-DIALOGUE ET ANTI-PORT
# ---------------------------------------------------------------------------
**.masterId = 1
**.macCellId = 1
**.nrMasterId = 1
**.nrMacCellId = 1

# Délais de transmission
**.server.ppp[*].**.delay = 50ms
**.gnb[0].ppp[*].**.delay = 50ms

# Paramètres de Mobilité Globaux
**.initialZ = 0m
**.mobility.initFromDisplayString = false
**.mobility.updateInterval = 0.01s
**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 100m
**.speedStdDev = 0mps
**.angleStdDev = 0deg
**.alpha = 0.5
**.margin = 10m

# --- CORRECTION DES PORTS ---
# Au lieu d'un port fixe 1000, on utilise le port (1000 + index de l'app)
# pour éviter les collisions sur le serveur qui a 15 apps.
*.server.app[*].localPort = 1000 + ancestorIndex(0)
*.ue[*].app[0].localPort = 1000
**.startTime = 0.1s
**.stopTime = -1s

[Config Statistics]
**.channelModel = "UMA"
**.pathlossModel = "P3GPP38901"
**.transmitter.power = 0.01W
**.cellularNic.phy.receiver.noiseFigure = 5dB

# ---------------------------------------------------------------------------
# VARIATIONS POUR L'APPRENTISSAGE DU GNN (Généralisation)
# ---------------------------------------------------------------------------
**.gnb[*].nic.phy.transmitter.power = ${power=0.01W, 0.1W, 0.5W, 2W}
**.gnb[*].cellularNic.mac.schedulingDisciplineDl = ${sched="PF","MAXCI","DRR", "QOS_PF", "MAXCI_MB", "ALLOCATOR_BESTFIT"}
**.gnb[*].cellularNic.mac.schedulingDisciplineUl = ${sched}
**.gnb[*].cellularNic.numBands = 50

**.rlc.um.queueSize = ${qSize= 50KiB, 100KiB, 2MiB, 10MiB}
**.mac.queueSize = ${qSize}

# ---------------------------------------------------------------------------
# CONFIGURATION DU SCÉNARIO 15 UEs (DT-Scenario)
# ---------------------------------------------------------------------------
[Config DT-Scenario]
extends = Statistics

*.numUe = 20
*.numGnb = 1
*.server.numApps = 20
*.ue[*].numApps = 1

# Connecteur pour 21 entités (20 UEs + 1 gNB)
*.dtConnector.numMobilityModules = 21
*.dtConnector.samplingInterval = 0.05s
*.dtConnector.mobilityModulePaths = "ue[0].mobility,ue[1].mobility,ue[2].mobility,ue[3].mobility,ue[4].mobility,ue[5].mobility,ue[6].mobility,ue[7].mobility,ue[8].mobility,ue[9].mobility,ue[10].mobility,ue[11].mobility,ue[12].mobility,ue[13].mobility,ue[14].mobility,ue[15].mobility,ue[16].mobility,ue[17].mobility,ue[18].mobility,ue[19].mobility,gnb[0].mobility"

*.gnb[0].mobility.typename = "StationaryMobility"
*.gnb[0].mobility.initialX = 500m
*.gnb[0].mobility.initialY = 500m
*.gnb[0].mobility.initialZ = 20m

# ===========================================================================
# DISTRIBUTION DES TRAFFICS (Modèle RouteNet-Fermi) ET MOBILITÉ
# ===========================================================================

# --- [EXPONENTIAL] : UEs 0, 1, 2 (Downlink) ---
# Trafic: Arrivées de paquets Poisson (Requêtes/Réponses critiques)
# Mobilité: GaussMarkov (Mouvements aléatoires fluides)
*.server.app[0..2].typename = "UdpBasicApp"
*.server.app[0..2].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[0..2].destPort = 1000 
*.server.app[0..2].messageLength = 40B
*.server.app[0..2].sendInterval = exponential(0.005s) 
*.ue[0..2].app[0].typename = "UdpSink"
*.ue[0..2].mobility.typename = "GaussMarkovMobility"
*.ue[0..2].mobility.speed = 1mps

# --- [DETERMINISTIC] : UEs 3, 4, 5 (Uplink) ---
# Trafic: Périodique pur (Boucle de contrôle robotique)
# Mobilité: Stationary (Capteurs en ligne de production)
*.ue[3..5].app[0].typename = "UdpBasicApp"
*.ue[3..5].app[0].destAddresses = "server"
*.ue[3..5].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[3..5].app[0].messageLength = 100B
*.ue[3..5].app[0].sendInterval = 0.002s 
*.server.app[3..5].typename = "UdpSink"
*.ue[3..5].mobility.typename = "StationaryMobility"
*.ue[3..5].mobility.initialX = uniform(450m, 550m)
*.ue[3..5].mobility.initialY = uniform(450m, 550m)

# --- [UNIFORM] : UEs 6, 7, 8 (Downlink) ---
# Trafic: Gigue/Jitter (Synchronisation d'horloge avec incertitude)
# Mobilité: CircleMobility (Surveillance périmétrale)
*.server.app[6..8].typename = "UdpBasicApp"
*.server.app[6..8].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[6..8].destPort = 1000
*.server.app[6..8].messageLength = 50B
*.server.app[6..8].sendInterval = uniform(0.001s, 0.004s)
*.ue[6..8].app[0].typename = "UdpSink"
*.ue[6..8].mobility.typename = "CircleMobility"
*.ue[6..8].mobility.cx = 500m
*.ue[6..8].mobility.cy = 500m
*.ue[6..8].mobility.r = 50m
*.ue[6..8].mobility.speed = 5mps

# --- [NORMAL] : UEs 9, 10, 11 (Uplink) ---
# Trafic: Taille de message variable (Télémétrie compressée)
# Mobilité: LinearMobility (AGV - Véhicule guidé automatique)
*.ue[9..11].app[0].typename = "UdpBasicApp"
*.ue[9..11].app[0].destAddresses = "server"
*.ue[9..11].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[9..11].app[0].messageLength = max(40, int(normal(80, 20))) * 1B
*.ue[9..11].app[0].sendInterval = 0.01s
*.server.app[9..11].typename = "UdpSink"
*.ue[9..11].mobility.typename = "LinearMobility"
*.ue[9..11].mobility.speed = 10mps
*.ue[9..11].mobility.angle = 0deg

# --- [ONOFF] : UEs 12, 13, 14 (Downlink) ---
# Trafic: Rafales d'alertes (Burst URLLC lors d'un incident)
# Mobilité: GaussMarkov
*.server.app[12..14].typename = "UdpBasicApp"
*.server.app[12..14].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[12..14].destPort = 1000
*.server.app[12..14].messageLength = 200B
# Simulation OnOff : activé 20% du temps avec envois très denses
*.server.app[12..14].sendInterval = (uniform(0,1) < 0.2) ? 0.0005s : 1s 
*.ue[12..14].app[0].typename = "UdpSink"
*.ue[12..14].mobility.typename = "GaussMarkovMobility"
*.ue[12..14].mobility.speed = 2mps

# --- [PPBP / PARETO] : UEs 15, 16, 17 (Uplink) ---
# Trafic: Trafic agrégé "Heavy-tail" (Multiples capteurs URLLC)
# Mobilité: Stationary (Infrastructure fixe)
*.ue[15..17].app[0].typename = "UdpBasicApp"
*.ue[15..17].app[0].destAddresses = "server"
*.ue[15..17].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[15..17].app[0].messageLength = 64B
*.ue[15..17].app[0].sendInterval = pareto(0.002s, 1.2)
*.server.app[15..17].typename = "UdpSink"
*.ue[15..17].mobility.typename = "StationaryMobility"
*.ue[15..17].mobility.initialX = uniform(100m, 900m)
*.ue[15..17].mobility.initialY = uniform(100m, 900m)

# --- [AR1 / AUTOREGRESSIVE] : UEs 18, 19 (Uplink) ---
# Trafic: Corrélation temporelle (Flux vidéo basse latence pour guidage)
# Mobilité: LinearMobility (Drone ou véhicule rapide)
*.ue[18..19].app[0].typename = "UdpBasicApp"
*.ue[18..19].app[0].destAddresses = "server"
*.ue[18..19].app[0].destPort = 1000 + ancestorIndex(1)
# Utilisation d'une somme pour simuler une dépendance (simplifié pour OMNeT)
*.ue[18..19].app[0].messageLength = 120B
*.ue[18..19].app[0].sendInterval = 0.005s + normal(0s, 0.001s)
*.server.app[18..19].typename = "UdpSink"
*.ue[18..19].mobility.typename = "LinearMobility"
*.ue[18..19].mobility.speed = 20mps