[General]
network = src.FiveGNetwork
sim-time-limit = 120s
#scheduler-class = "omnetpp::cRealTimeScheduler"

# --- Chemins ---
ned-path = ../src:../../Simu5G/src:../../inet4.5/src

# --- Config Réseau ---
*.configurator.typename = "Ipv4NetworkConfigurator"
*.configurator.addDefaultRoutes = true

# Désactiver les gros fichiers .vec/.sca OMNeT++
**.vector-recording = false
**.scalar-recording = false

# ---------------------------------------------------------------------------
# BLINDAGE TOTAL ANTI-DIALOGUE ET ANTI-PORT
# ---------------------------------------------------------------------------
**.masterId = 1
**.macCellId = 1
**.nrMasterId = 1
**.nrMacCellId = 1

# Délais de transmission
**.server.ppp[*].**.delay = 50ms
**.gnb[*].ppp[*].**.delay = 50ms

# Paramètres de Mobilité Globaux
**.initialZ = 0m
**.mobility.initFromDisplayString = false
**.mobility.updateInterval = 0.01s
**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 100m
**.speedStdDev = 0mps
**.angleStdDev = 0deg
**.alpha = 0.5
**.margin = 10m

# --- CORRECTION DES PORTS ---
*.server.app[*].localPort = 1000 + ancestorIndex(0)
*.ue[*].app[0].localPort = 1000
**.startTime = 0.1s
**.stopTime = -1s

[Config Statistics]
**.channelModel = "UMA"
**.pathlossModel = "P3GPP38901"
**.transmitter.power = 0.01W
**.cellularNic.phy.receiver.noiseFigure = 5dB

# ---------------------------------------------------------------------------
# FIXED CONFIGURATION FOR LATENCY/SPEEDUP SCALING
# We do not sweep power/scheduler/queue size here, to isolate graph-size effect.
# ---------------------------------------------------------------------------
**.gnb[*].nic.phy.transmitter.power = 0.5W
**.gnb[*].cellularNic.mac.schedulingDisciplineDl = "PF"
**.gnb[*].cellularNic.mac.schedulingDisciplineUl = "PF"
**.gnb[*].cellularNic.numBands = 50

**.rlc.um.queueSize = 100KiB
**.mac.queueSize = 100KiB

# ---------------------------------------------------------------------------
# S30 : 30 UEs, 2 gNBs, latency/speedup scaling scenario
# ---------------------------------------------------------------------------
[Config DT-Scenario]
extends = Statistics

*.numUe = 30
*.numGnb = 2
*.server.numApps = 30
*.ue[*].numApps = 1

*.dtConnector.numMobilityModules = 32
*.dtConnector.samplingInterval = 0.1s
*.dtConnector.mobilityModulePaths = "ue[0].mobility,ue[1].mobility,ue[2].mobility,ue[3].mobility,ue[4].mobility,ue[5].mobility,ue[6].mobility,ue[7].mobility,ue[8].mobility,ue[9].mobility,ue[10].mobility,ue[11].mobility,ue[12].mobility,ue[13].mobility,ue[14].mobility,ue[15].mobility,ue[16].mobility,ue[17].mobility,ue[18].mobility,ue[19].mobility,ue[20].mobility,ue[21].mobility,ue[22].mobility,ue[23].mobility,ue[24].mobility,ue[25].mobility,ue[26].mobility,ue[27].mobility,ue[28].mobility,ue[29].mobility,gnb[0].mobility,gnb[1].mobility"

# gNB positions and cell identifiers
*.gnb[0].mobility.typename = "StationaryMobility"
*.gnb[0].mobility.initialX = 250m
*.gnb[0].mobility.initialY = 250m
*.gnb[0].mobility.initialZ = 30m

*.gnb[0].masterId = 1
*.gnb[0].macCellId = 1
*.gnb[0].nrMasterId = 1
*.gnb[0].nrMacCellId = 1

*.gnb[1].mobility.typename = "StationaryMobility"
*.gnb[1].mobility.initialX = 750m
*.gnb[1].mobility.initialY = 250m
*.gnb[1].mobility.initialZ = 30m

*.gnb[1].masterId = 2
*.gnb[1].macCellId = 2
*.gnb[1].nrMasterId = 2
*.gnb[1].nrMacCellId = 2

# UE-to-gNB associations
*.ue[0..14].masterId = 1
*.ue[0..14].macCellId = 1
*.ue[0..14].nrMasterId = 1
*.ue[0..14].nrMacCellId = 1

*.ue[15..29].masterId = 2
*.ue[15..29].macCellId = 2
*.ue[15..29].nrMasterId = 2
*.ue[15..29].nrMacCellId = 2

# Traffic and mobility patterns
# Types conserved: EXPONENTIAL, DETERMINISTIC, UNIFORM, ONOFF, PPBP
# Mobilities conserved: GaussMarkov, Linear, Circle

# UEs 0..3: EXPONENTIAL + GaussMarkov around gNB0
*.server.app[0..3].typename = "UdpBasicApp"
*.server.app[0..3].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[0..3].destPort = 1000
*.server.app[0..3].messageLength = 1450B
*.server.app[0..3].sendInterval = exponential(0.001s)
*.ue[0..3].app[0].typename = "UdpSink"

*.ue[0..3].mobility.typename = "GaussMarkovMobility"
*.ue[0..3].mobility.initialX = uniform(100m, 400m)
*.ue[0..3].mobility.initialY = uniform(100m, 400m)
*.ue[0..3].mobility.speed = uniform(20mps, 40mps)

# UEs 4..7: DETERMINISTIC + Linear around gNB0
*.ue[4..7].app[0].typename = "UdpBasicApp"
*.ue[4..7].app[0].destAddresses = "server"
*.ue[4..7].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[4..7].app[0].messageLength = 1450B
*.ue[4..7].app[0].sendInterval = 0.001s
*.server.app[4..7].typename = "UdpSink"

*.ue[4..7].mobility.typename = "LinearMobility"
*.ue[4..7].mobility.initialX = uniform(100m, 400m)
*.ue[4..7].mobility.initialY = uniform(100m, 400m)
*.ue[4..7].mobility.speed = uniform(25mps, 45mps)
*.ue[4..7].mobility.angle = uniform(0deg, 360deg)

# UEs 8..10: UNIFORM + Circle around gNB0
*.server.app[8..10].typename = "UdpBasicApp"
*.server.app[8..10].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[8..10].destPort = 1000
*.server.app[8..10].messageLength = 1450B
*.server.app[8..10].sendInterval = uniform(0.001s, 0.005s)
*.ue[8..10].app[0].typename = "UdpSink"

*.ue[8..10].mobility.typename = "CircleMobility"
*.ue[8..10].mobility.cx = 250m
*.ue[8..10].mobility.cy = 250m
*.ue[8..10].mobility.r = 180m
*.ue[8..10].mobility.speed = 25mps

# UEs 11..12: ONOFF + GaussMarkov around gNB0
*.server.app[11..12].typename = "UdpBasicApp"
*.server.app[11..12].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[11..12].destPort = 1000
*.server.app[11..12].messageLength = 1450B
*.server.app[11..12].sendInterval = uniform(0,1) < 0.8 ? 0.0002s : 0.4s
*.ue[11..12].app[0].typename = "UdpSink"

*.ue[11..12].mobility.typename = "GaussMarkovMobility"
*.ue[11..12].mobility.initialX = uniform(100m, 400m)
*.ue[11..12].mobility.initialY = uniform(100m, 400m)
*.ue[11..12].mobility.speed = uniform(30mps, 60mps)

# UEs 13..14: PPBP + Linear around gNB0
*.server.app[13..14].typename = "UdpBasicApp"
*.server.app[13..14].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[13..14].destPort = 1000
*.server.app[13..14].messageLength = 1450B
*.server.app[13..14].sendInterval = pareto(0.001s, 1.3)
*.ue[13..14].app[0].typename = "UdpSink"

*.ue[13..14].mobility.typename = "LinearMobility"
*.ue[13..14].mobility.initialX = uniform(100m, 400m)
*.ue[13..14].mobility.initialY = uniform(100m, 400m)
*.ue[13..14].mobility.speed = uniform(35mps, 70mps)
*.ue[13..14].mobility.angle = uniform(0deg, 360deg)

# UEs 15..18: EXPONENTIAL + GaussMarkov around gNB1
*.server.app[15..18].typename = "UdpBasicApp"
*.server.app[15..18].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[15..18].destPort = 1000
*.server.app[15..18].messageLength = 1450B
*.server.app[15..18].sendInterval = exponential(0.001s)
*.ue[15..18].app[0].typename = "UdpSink"

*.ue[15..18].mobility.typename = "GaussMarkovMobility"
*.ue[15..18].mobility.initialX = uniform(600m, 900m)
*.ue[15..18].mobility.initialY = uniform(100m, 400m)
*.ue[15..18].mobility.speed = uniform(20mps, 40mps)

# UEs 19..22: DETERMINISTIC + Linear around gNB1
*.ue[19..22].app[0].typename = "UdpBasicApp"
*.ue[19..22].app[0].destAddresses = "server"
*.ue[19..22].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[19..22].app[0].messageLength = 1450B
*.ue[19..22].app[0].sendInterval = 0.001s
*.server.app[19..22].typename = "UdpSink"

*.ue[19..22].mobility.typename = "LinearMobility"
*.ue[19..22].mobility.initialX = uniform(600m, 900m)
*.ue[19..22].mobility.initialY = uniform(100m, 400m)
*.ue[19..22].mobility.speed = uniform(25mps, 45mps)
*.ue[19..22].mobility.angle = uniform(0deg, 360deg)

# UEs 23..25: UNIFORM + Circle around gNB1
*.server.app[23..25].typename = "UdpBasicApp"
*.server.app[23..25].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[23..25].destPort = 1000
*.server.app[23..25].messageLength = 1450B
*.server.app[23..25].sendInterval = uniform(0.001s, 0.005s)
*.ue[23..25].app[0].typename = "UdpSink"

*.ue[23..25].mobility.typename = "CircleMobility"
*.ue[23..25].mobility.cx = 750m
*.ue[23..25].mobility.cy = 250m
*.ue[23..25].mobility.r = 180m
*.ue[23..25].mobility.speed = 25mps

# UEs 26..27: ONOFF + GaussMarkov around gNB1
*.server.app[26..27].typename = "UdpBasicApp"
*.server.app[26..27].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[26..27].destPort = 1000
*.server.app[26..27].messageLength = 1450B
*.server.app[26..27].sendInterval = uniform(0,1) < 0.8 ? 0.0002s : 0.4s
*.ue[26..27].app[0].typename = "UdpSink"

*.ue[26..27].mobility.typename = "GaussMarkovMobility"
*.ue[26..27].mobility.initialX = uniform(600m, 900m)
*.ue[26..27].mobility.initialY = uniform(100m, 400m)
*.ue[26..27].mobility.speed = uniform(30mps, 60mps)

# UEs 28..29: PPBP + Linear around gNB1
*.server.app[28..29].typename = "UdpBasicApp"
*.server.app[28..29].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[28..29].destPort = 1000
*.server.app[28..29].messageLength = 1450B
*.server.app[28..29].sendInterval = pareto(0.001s, 1.3)
*.ue[28..29].app[0].typename = "UdpSink"

*.ue[28..29].mobility.typename = "LinearMobility"
*.ue[28..29].mobility.initialX = uniform(600m, 900m)
*.ue[28..29].mobility.initialY = uniform(100m, 400m)
*.ue[28..29].mobility.speed = uniform(35mps, 70mps)
*.ue[28..29].mobility.angle = uniform(0deg, 360deg)

