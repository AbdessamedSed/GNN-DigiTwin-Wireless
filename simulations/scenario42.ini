[General]
network = src.FiveGNetwork
sim-time-limit = 100s
scheduler-class = "omnetpp::cRealTimeScheduler"

# --- Chemins ---
ned-path = ../src:../../Simu5G/src:../../inet4.5/src

# --- Config Réseau ---
*.configurator.typename = "Ipv4NetworkConfigurator"
*.configurator.addDefaultRoutes = true

# ---------------------------------------------------------------------------
# BLINDAGE ANTI-DIALOGUE ET ANTI-PORT
# ---------------------------------------------------------------------------
**.masterId = 1
**.macCellId = 1
**.nrMasterId = 1
**.nrMacCellId = 1

**.initialZ = 0m
**.mobility.initFromDisplayString = false
**.mobility.updateInterval = 0.01s
**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 100m
**.speedStdDev = 0mps
**.angleStdDev = 0deg
**.alpha = 0.5
**.margin = 10m

*.server.app[*].localPort = -1
*.ue[*].app[0].localPort = 1000
**.destPort = 1000

**.startTime = 0.1s
**.stopTime = -1s

[Config Statistics]
**.channelModel = "UMA"
**.gnb[*].cellularNic.phy.transmitter.power = 0.1W
**.gnb[*].cellularNic.mac.schedulingDisciplineDl = "MAXCI"
**.gnb[*].cellularNic.mac.schedulingDisciplineUl = "MAXCI"
**.gnb[*].cellularNic.numBands = 50
**.rlc.um.queueSize = 2MiB
**.mac.queueSize = 2MiB

            
[Config DT-Scenario]

extends = Statistics

# 1. Configuration des Noeuds
*.numUe = 20
*.numGnb = 1
*.server.numApps = 60 # 3 vagues de trafic pour une variété extrême
*.ue[*].numApps = 1

# 2. Configuration du DTConnector (Haute précision requise pour Gauss-Markov)
*.dtConnector.numMobilityModules = 21 
*.dtConnector.samplingInterval = 0.002s # 500 Hz : indispensable pour capter les micro-variations à 70 m/s
*.dtConnector.mobilityModulePaths = "ue[0].mobility,ue[1].mobility,ue[2].mobility,ue[3].mobility,ue[4].mobility,ue[5].mobility,ue[6].mobility,ue[7].mobility,ue[8].mobility,ue[9].mobility,ue[10].mobility,ue[11].mobility,ue[12].mobility,ue[13].mobility,ue[14].mobility,ue[15].mobility,ue[16].mobility,ue[17].mobility,ue[18].mobility,ue[19].mobility,gnb[0].mobility"

# 3. Position du gNB
*.gnb[0].mobility.typename = "StationaryMobility"
*.gnb[0].mobility.initialX = 1000m
*.gnb[0].mobility.initialY = 1000m

# 4. MOBILITÉ EXTRÊME : Gauss-Markov (Mouvement autoroutier chaotique)
# Vitesse entre 30m/s (108 km/h) et 70m/s (252 km/h)
**.ue[*].mobility.typename = "GaussMarkovMobility"
**.ue[*].mobility.initialX = uniform(200m, 1800m)
**.ue[*].mobility.initialY = uniform(200m, 1800m)
**.ue[*].mobility.speed = uniform(30mps, 70mps)
**.ue[*].mobility.speedStdDev = 10mps
**.ue[*].mobility.angleStdDev = 30deg
**.ue[*].mobility.alpha = 0.4 # Très réactif aux changements de direction
**.ue[*].mobility.margin = 50m
**.constraintAreaMaxX = 2000m
**.constraintAreaMaxY = 2000m

# 5. TRAFIC "THE BEAST" (Transition brutale à T=10s)
# Tous les trafics commencent à 10s pour simuler le passage Idle -> Highway Stress

*.server.app[*].typename = "UdpBasicApp"
*.server.app[*].destPort = 1000
*.server.app[*].startTime = 10s # LE CHOC COMMENCE ICI

# --- GROUPE A (UE 0..6) : L'Enfer Numérique (Moyenne 0.5ms = 2000 paquets/sec) ---
*.server.app[0..6].destAddresses = "ue[" + string(ancestorIndex(0) % 20) + "]"
*.server.app[0..6].messageLength = 1400B
*.server.app[0..6].sendInterval = exponential(0.0005s) 

# --- GROUPE B (UE 7..13) : Le Stress Test (Moyenne 2ms = 500 paquets/sec) ---
*.server.app[20..26].destAddresses = "ue[" + string(ancestorIndex(0) % 20) + "]"
*.server.app[20..26].messageLength = uniform(500B, 1200B)
*.server.app[20..26].sendInterval = exponential(0.002s)

# --- GROUPE C (UE 14..19) : Le Flux Instable (Moyenne 10ms avec gros paquets) ---
*.server.app[40..45].destAddresses = "ue[" + string(ancestorIndex(0) % 20) + "]"
*.server.app[40..45].messageLength = 1000B
*.server.app[40..45].sendInterval = exponential(0.01s)

# Réception
*.ue[*].app[0].typename = "UdpSink"