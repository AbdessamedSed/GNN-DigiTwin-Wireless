[General]
network = src.FiveGNetwork
sim-time-limit = 120s
#scheduler-class = "omnetpp::cRealTimeScheduler"

# --- Chemins (Identiques) ---
ned-path = ../src:../../Simu5G/src:../../inet4.5/src

# --- Config Réseau ---
*.configurator.typename = "Ipv4NetworkConfigurator"
*.configurator.addDefaultRoutes = true

# ---------------------------------------------------------------------------
# BLINDAGE TOTAL ANTI-DIALOGUE ET ANTI-PORT
# ---------------------------------------------------------------------------
**.masterId = 1
**.macCellId = 1
**.nrMasterId = 1
**.nrMacCellId = 1


**.initialZ = 0m
**.mobility.initFromDisplayString = false
**.mobility.updateInterval = 0.01s
**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 2000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 2000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 500m
**.speedStdDev = 0mps
**.angleStdDev = 0deg
**.alpha = 0.5
**.margin = 10m

*.server.app[*].localPort = 1000 + ancestorIndex(0)
*.ue[*].app[0].localPort = 1000
**.startTime = 0.1s
**.stopTime = -1s

[Config Statistics]
**.channelModel = "UMA"
**.pathlossModel = "P3GPP38901"
**.transmitter.power = 0.01W
**.cellularNic.phy.receiver.noiseFigure = 5dB

# ---------------------------------------------------------------------------
# VARIATIONS POUR L'APPRENTISSAGE DU GNN (Généralisation)
# ---------------------------------------------------------------------------
**.gnb[*].nic.phy.transmitter.power = ${power=0.01W, 0.1W, 0.5W, 2W}
**.gnb[*].cellularNic.mac.schedulingDisciplineDl = ${sched="PF","MAXCI","DRR", "QOS_PF", "MAXCI_MB", "ALLOCATOR_BESTFIT"}
**.gnb[*].cellularNic.mac.schedulingDisciplineUl = ${sched}
**.gnb[*].cellularNic.numBands = 50

**.rlc.um.queueSize = ${qSize= 50KiB, 100KiB, 2MiB, 10MiB}
**.mac.queueSize = ${qSize}

# ---------------------------------------------------------------------------
# CONFIGURATION DU SCÉNARIO 15 UEs (DT-Scenario)
# ---------------------------------------------------------------------------
[Config DT-Scenario]
extends = Statistics
*.dtConnector.mobilityModulePaths = "ue[0].mobility,ue[1].mobility,ue[2].mobility,ue[3].mobility,ue[4].mobility,ue[5].mobility,ue[6].mobility,ue[7].mobility,ue[8].mobility,ue[9].mobility,ue[10].mobility,ue[11].mobility,ue[12].mobility,ue[13].mobility,ue[14].mobility,ue[15].mobility,ue[16].mobility,ue[17].mobility,ue[18].mobility,ue[19].mobility,ue[20].mobility,ue[21].mobility,ue[22].mobility,ue[23].mobility,ue[24].mobility,ue[25].mobility,ue[26].mobility,ue[27].mobility,ue[28].mobility,ue[29].mobility,ue[30].mobility,ue[31].mobility,ue[32].mobility,ue[33].mobility,ue[34].mobility,ue[35].mobility,ue[36].mobility,ue[37].mobility,ue[38].mobility,ue[39].mobility,ue[40].mobility,ue[41].mobility,ue[42].mobility,ue[43].mobility,ue[44].mobility,ue[45].mobility,ue[46].mobility,ue[47].mobility,ue[48].mobility,ue[49].mobility,ue[50].mobility,ue[51].mobility,ue[52].mobility,ue[53].mobility,ue[54].mobility,ue[55].mobility,ue[56].mobility,ue[57].mobility,ue[58].mobility,ue[59].mobility,ue[60].mobility,ue[61].mobility,ue[62].mobility,ue[63].mobility,ue[64].mobility,ue[65].mobility,ue[66].mobility,ue[67].mobility,ue[68].mobility,ue[69].mobility,ue[70].mobility,ue[71].mobility,ue[72].mobility,ue[73].mobility,ue[74].mobility,ue[75].mobility,ue[76].mobility,ue[77].mobility,ue[78].mobility,ue[79].mobility,ue[80].mobility,ue[81].mobility,ue[82].mobility,ue[83].mobility,ue[84].mobility,ue[85].mobility,ue[86].mobility,ue[87].mobility,ue[88].mobility,ue[89].mobility,ue[90].mobility,ue[91].mobility,ue[92].mobility,ue[93].mobility,ue[94].mobility,ue[95].mobility,ue[96].mobility,ue[97].mobility,ue[98].mobility,ue[99].mobility,gnb[0].mobility"
*.numUe = 100
*.numGnb = 1
*.server.numApps = 100
*.ue[*].numApps = 1

# Configuration du connecteur Digital Twin (100 UEs + 1 gNB)
*.dtConnector.numMobilityModules = 101
*.dtConnector.samplingInterval = 0.1s

# Position du gNB (Tour au centre)
*.gnb[0].mobility.typename = "StationaryMobility"
*.gnb[0].mobility.initialX = 1000m
*.gnb[0].mobility.initialY = 1000m
*.gnb[0].mobility.initialZ = 35m

# ===========================================================================
# RÉPARTITION DU TRAFFIC mMTC (Uplink, Downlink et Distributions RouteNet)
# ===========================================================================

# --- GROUPE 1 : Capteurs de Mesure Périodique (Uplink - DETERMINISTIC) ---
# UEs 0 à 29 : 30 capteurs envoyant des petits paquets à intervalle fixe
*.ue[0..29].app[0].typename = "UdpBasicApp"
*.ue[0..29].app[0].destAddresses = "server"
*.ue[0..29].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[0..29].app[0].messageLength = 64B
*.ue[0..29].app[0].sendInterval = 0.5s 
*.server.app[0..29].typename = "UdpSink"
# Mobilité : Fixe (Compteurs d'eau/électricité)
*.ue[0..29].mobility.typename = "StationaryMobility"
*.ue[0..29].mobility.initialX = uniform(0m, 2000m)
*.ue[0..29].mobility.initialY = uniform(0m, 2000m)

# --- GROUPE 2 : Alarmes et Événements Aléatoires (Uplink - EXPONENTIAL) ---
# UEs 30 à 49 : 20 capteurs (détecteurs de fumée/intrusion)
*.ue[30..49].app[0].typename = "UdpBasicApp"
*.ue[30..49].app[0].destAddresses = "server"
*.ue[30..49].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[30..49].app[0].messageLength = 128B
*.ue[30..49].app[0].sendInterval = exponential(1s)
*.server.app[30..49].typename = "UdpSink"
# Mobilité : Très lente (Capteurs environnementaux)
*.ue[30..49].mobility.typename = "LinearMobility"
*.ue[30..49].mobility.speed = 1mps

# --- GROUPE 3 : Actionneurs de Contrôle (Downlink - UNIFORM) ---
# UEs 50 à 69 : 20 vannes ou interrupteurs pilotés par le serveur
*.server.app[50..69].typename = "UdpBasicApp"
*.server.app[50..69].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[50..69].destPort = 1000
*.server.app[50..69].messageLength = 100B
*.server.app[50..69].sendInterval = uniform(0.1s, 0.5s)
*.ue[50..69].app[0].typename = "UdpSink"
# Mobilité : Stationnaire
*.ue[50..69].mobility.typename = "StationaryMobility"

# --- GROUPE 4 : Monitoring Industriel (Uplink - NORMAL) ---
# UEs 70 à 84 : 15 capteurs de vibrations (Gaussienne pour le jitter machine)
*.ue[70..84].app[0].typename = "UdpBasicApp"
*.ue[70..84].app[0].destAddresses = "server"
*.ue[70..84].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[70..84].app[0].messageLength = 256B
*.ue[70..84].app[0].sendInterval = max(0.01s, normal(0.2s, 0.05s))
*.server.app[70..84].typename = "UdpSink"
# Mobilité : Robotique (Gauss Markov)
*.ue[70..84].mobility.typename = "GaussMarkovMobility"
*.ue[70..84].mobility.speed = 2mps

# --- GROUPE 5 : Maintenance/Logs en rafale (Uplink - ONOFF) ---
# UEs 85 à 99 : 15 nœuds qui envoient des logs par salves
*.ue[85..99].app[0].typename = "UdpBasicApp"
*.ue[85..99].app[0].destAddresses = "server"
*.ue[85..99].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[85..99].app[0].messageLength = 512B
# Simulation de l'effet ON/OFF via une condition ternaire (RouteNet-Fermi like)
*.ue[85..99].app[0].sendInterval = (uniform(0,1) < 0.1 ? 0.01s : 2s)
*.server.app[85..99].typename = "UdpSink"
# Mobilité : Véhicules de patrouille (Linear)
*.ue[85..99].mobility.typename = "LinearMobility"
*.ue[85..99].mobility.speed = 15mps
*.ue[85..99].mobility.initialX = uniform(0m, 1000m)
*.ue[85..99].mobility.initialY = uniform(0m, 1000m)
