[General]
network = src.FiveGNetwork
sim-time-limit = 120s
#scheduler-class = "omnetpp::cRealTimeScheduler"

# --- Chemins ---
ned-path = ../src:../../Simu5G/src:../../inet4.5/src

# --- Config Réseau ---
*.configurator.typename = "Ipv4NetworkConfigurator"
*.configurator.addDefaultRoutes = true

# Désactiver les gros fichiers .vec/.sca OMNeT++
**.vector-recording = false
**.scalar-recording = false

# ---------------------------------------------------------------------------
# BLINDAGE TOTAL ANTI-DIALOGUE ET ANTI-PORT
# ---------------------------------------------------------------------------
**.masterId = 1
**.macCellId = 1
**.nrMasterId = 1
**.nrMacCellId = 1

# Délais de transmission
**.server.ppp[*].**.delay = 50ms
**.gnb[*].ppp[*].**.delay = 50ms

# Paramètres de Mobilité Globaux
**.initialZ = 0m
**.mobility.initFromDisplayString = false
**.mobility.updateInterval = 0.01s
**.constraintAreaMinX = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMinY = 0m
**.constraintAreaMaxY = 1000m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxZ = 100m
**.speedStdDev = 0mps
**.angleStdDev = 0deg
**.alpha = 0.5
**.margin = 10m

# --- CORRECTION DES PORTS ---
*.server.app[*].localPort = 1000 + ancestorIndex(0)
*.ue[*].app[0].localPort = 1000
**.startTime = 0.1s
**.stopTime = -1s

[Config Statistics]
**.channelModel = "UMA"
**.pathlossModel = "P3GPP38901"
**.transmitter.power = 0.01W
**.cellularNic.phy.receiver.noiseFigure = 5dB

# ---------------------------------------------------------------------------
# FIXED CONFIGURATION FOR LATENCY/SPEEDUP SCALING
# We do not sweep power/scheduler/queue size here, to isolate graph-size effect.
# ---------------------------------------------------------------------------
**.gnb[*].nic.phy.transmitter.power = 0.5W
**.gnb[*].cellularNic.mac.schedulingDisciplineDl = "PF"
**.gnb[*].cellularNic.mac.schedulingDisciplineUl = "PF"
**.gnb[*].cellularNic.numBands = 50

**.rlc.um.queueSize = 100KiB
**.mac.queueSize = 100KiB

# ---------------------------------------------------------------------------
# S100 : 100 UEs, 4 gNBs, latency/speedup scaling scenario
# ---------------------------------------------------------------------------
[Config DT-Scenario]
extends = Statistics

*.numUe = 100
*.numGnb = 4
*.server.numApps = 100
*.ue[*].numApps = 1

*.dtConnector.numMobilityModules = 104
*.dtConnector.samplingInterval = 0.1s
*.dtConnector.mobilityModulePaths = "ue[0].mobility,ue[1].mobility,ue[2].mobility,ue[3].mobility,ue[4].mobility,ue[5].mobility,ue[6].mobility,ue[7].mobility,ue[8].mobility,ue[9].mobility,ue[10].mobility,ue[11].mobility,ue[12].mobility,ue[13].mobility,ue[14].mobility,ue[15].mobility,ue[16].mobility,ue[17].mobility,ue[18].mobility,ue[19].mobility,ue[20].mobility,ue[21].mobility,ue[22].mobility,ue[23].mobility,ue[24].mobility,ue[25].mobility,ue[26].mobility,ue[27].mobility,ue[28].mobility,ue[29].mobility,ue[30].mobility,ue[31].mobility,ue[32].mobility,ue[33].mobility,ue[34].mobility,ue[35].mobility,ue[36].mobility,ue[37].mobility,ue[38].mobility,ue[39].mobility,ue[40].mobility,ue[41].mobility,ue[42].mobility,ue[43].mobility,ue[44].mobility,ue[45].mobility,ue[46].mobility,ue[47].mobility,ue[48].mobility,ue[49].mobility,ue[50].mobility,ue[51].mobility,ue[52].mobility,ue[53].mobility,ue[54].mobility,ue[55].mobility,ue[56].mobility,ue[57].mobility,ue[58].mobility,ue[59].mobility,ue[60].mobility,ue[61].mobility,ue[62].mobility,ue[63].mobility,ue[64].mobility,ue[65].mobility,ue[66].mobility,ue[67].mobility,ue[68].mobility,ue[69].mobility,ue[70].mobility,ue[71].mobility,ue[72].mobility,ue[73].mobility,ue[74].mobility,ue[75].mobility,ue[76].mobility,ue[77].mobility,ue[78].mobility,ue[79].mobility,ue[80].mobility,ue[81].mobility,ue[82].mobility,ue[83].mobility,ue[84].mobility,ue[85].mobility,ue[86].mobility,ue[87].mobility,ue[88].mobility,ue[89].mobility,ue[90].mobility,ue[91].mobility,ue[92].mobility,ue[93].mobility,ue[94].mobility,ue[95].mobility,ue[96].mobility,ue[97].mobility,ue[98].mobility,ue[99].mobility,gnb[0].mobility,gnb[1].mobility,gnb[2].mobility,gnb[3].mobility"

