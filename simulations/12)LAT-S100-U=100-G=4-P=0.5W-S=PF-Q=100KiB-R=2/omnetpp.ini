# Traffic and mobility patterns
# Types conserved: EXPONENTIAL, DETERMINISTIC, UNIFORM, ONOFF, PPBP
# Mobilities conserved: GaussMarkov, Linear, Circle

# UEs 0..6: EXPONENTIAL + GaussMarkov around gNB0
*.server.app[0..6].typename = "UdpBasicApp"
*.server.app[0..6].destAddresses = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[0..6].destPort = 1000
*.server.app[0..6].messageLength = 1450B
*.server.app[0..6].sendInterval = exponential(0.001s)
*.ue[0..6].app[0].typename = "UdpSink"

*.ue[0..6].mobility.typename = "GaussMarkovMobility"
*.ue[0..6].mobility.initialX = uniform(100m, 400m)
*.ue[0..6].mobility.initialY = uniform(100m, 400m)
*.ue[0..6].mobility.speed = uniform(20mps, 40mps)

# UEs 7..12: DETERMINISTIC + Linear around gNB0
*.ue[7..12].app[0].typename = "UdpBasicApp"
*.ue[7..12].app[0].destAddresses = "server"
*.ue[7..12].app[0].destPort = 1000 + ancestorIndex(1)
*.ue[7..12].app[0].messageLength = 1450B
*.ue[7..12].app[0].sendInterval = 0.001s
*.server.app[7..12].typename = "UdpSink"

*.ue[7..12].mobility.typename = "LinearMobility"
*.ue[7..12].mobility.initialX = uniform(100m, 400m)
*.ue[7..12].mobility.initialY = uniform(100m, 400m)
*.ue[7..12].mobility.speed = uniform(25mps, 45mps)
*.ue[7..12].mobility.angle = uniform(0deg, 360deg)

